<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAVA · Aluno</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --p1:#1c3b6b;--p2:#10233f;--gold:#b3872c;--grad:linear-gradient(135deg,var(--p1),var(--p2));
  --dark:#0c1220;--sidebar-w:246px;
  --text:#12182a;--muted:#6b7385;--border:#e2e6ee;--bg:#f3f5f9;--white:#fff;
  --green:#157347;--red:#b3261e;--amber:#b3690e;
  --radius:10px;--shadow:0 1px 2px rgba(15,23,42,.06);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;}

/* ── Sidebar ── */
.sidebar{width:var(--sidebar-w);background:var(--dark);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.07);}
.sidebar-logo-row{display:flex;align-items:center;gap:10px;}
.logo-icon-box{width:30px;height:30px;background:var(--p1);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-icon-box i{color:#fff;font-size:16px;}
.sidebar-logo h1{font-family:'Manrope',sans-serif;font-size:17px;font-weight:700;color:#fff;}
.sidebar-logo span{font-size:11px;color:rgba(255,255,255,.4);font-weight:400;display:block;margin-top:2px;}
.user-card{margin:12px 10px 8px;background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--p2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;}
.user-card .uname{font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;color:#fff;}
.user-card .urole{font-size:11px;color:rgba(255,255,255,.45);margin-top:1px;}
.sidebar-section{padding:18px 16px 6px;font-size:11px;font-weight:700;color:rgba(255,255,255,.32);letter-spacing:.2px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 12px;margin:0 8px;border-radius:7px;border-left:3px solid transparent;cursor:pointer;transition:all .15s;color:rgba(255,255,255,.62);font-size:13px;font-weight:500;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.08);color:#fff;font-weight:700;border-left-color:var(--gold);}
.nav-item i{font-size:16px;width:18px;text-align:center;flex-shrink:0;}
.nav-turma-item{padding:7px 14px 7px 40px;margin:0 8px;border-radius:6px;font-size:12px;color:rgba(255,255,255,.48);cursor:pointer;transition:all .15s;}
.nav-turma-item:hover{color:#fff;background:rgba(255,255,255,.04);}
.nav-turma-item.active{color:var(--gold);font-weight:700;background:rgba(255,255,255,.06);}
.sidebar-bottom{margin-top:auto;padding:12px;display:flex;flex-direction:column;gap:6px;}
.btn-join{width:100%;padding:9px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.15);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;}
.btn-join:hover{background:rgba(255,255,255,.13);color:#fff;}
.btn-logout{width:100%;padding:9px;background:rgba(255,255,255,.04);color:rgba(255,255,255,.4);border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-logout:hover{background:rgba(220,38,38,.22);color:#fff;}
.btn-logout i{font-size:14px;}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:var(--white);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.topbar h2{font-family:'Manrope',sans-serif;font-size:16px;font-weight:700;color:var(--dark);}
.topbar-actions{display:flex;gap:8px;}
.content{flex:1;overflow-y:auto;padding:22px;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;font-family:'Manrope',sans-serif;}
.btn i{font-size:15px;}
.btn-primary{background:var(--p1);color:#fff;}
.btn-primary:hover{background:#142c52;}
.btn-ghost{background:rgba(79,70,229,.07);color:var(--p1);}
.btn-ghost:hover{background:rgba(79,70,229,.14);}
.btn-sm{padding:6px 13px;font-size:12px;}

/* ── Cards ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{background:var(--white);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;align-items:center;gap:14px;}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-icon i{font-size:20px;}
.stat-icon.blue{background:#e8eef8;color:var(--p1);}
.stat-icon.purple{background:#f3f5f9;color:var(--p2);}
.stat-icon.green{background:#e6f4ea;color:var(--green);}
.stat-icon.amber{background:#f7ecd9;color:var(--amber);}
.stat-info .num{font-family:'Manrope',sans-serif;font-size:26px;font-weight:800;color:var(--dark);}
.stat-info .lbl{font-size:12px;color:var(--muted);margin-top:2px;}

.turma-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:all .15s;}
.turma-card:hover{border-color:var(--p1);box-shadow:0 4px 16px rgba(79,70,229,.12);}
.turma-card h3{font-family:'Manrope',sans-serif;font-size:16px;font-weight:700;}
.turma-card .tm{font-size:12px;color:var(--muted);}
.turma-card .turma-open-btn{font-size:12px;color:var(--p1);background:#e8eef8;border:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;width:100%;text-align:center;}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-header h3{font-family:'Manrope',sans-serif;font-size:15px;font-weight:700;color:var(--dark);}

/* ── List cards ── */
.list-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;margin-bottom:14px;}
.list-item{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;transition:background .12s;}
.list-item:last-child{border-bottom:none;}
.list-item:hover{background:#f6f7f9;}
.list-item-icon{width:36px;height:36px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.list-item-icon i{font-size:17px;color:var(--p1);}
.list-item-info{flex:1;min-width:0;}
.list-item-info .title{font-weight:700;font-size:14px;color:var(--dark);}
.list-item-info .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-blue{background:#e8eef8;color:var(--p1);}
.badge-green{background:#e6f4ea;color:var(--green);}

/* ── Lesson Viewer ── */
.lesson-viewer{position:fixed;inset:0;background:var(--bg);z-index:2000;display:none;flex-direction:column;}
.lesson-viewer.open{display:flex;}
.lesson-topbar{background:var(--white);padding:0 20px;height:56px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);flex-shrink:0;}
.lesson-topbar h2{font-family:'Manrope',sans-serif;font-size:16px;font-weight:700;flex:1;}
.lesson-body{flex:1;overflow-y:auto;padding:36px 18px;}
.lesson-content-area{max-width:820px;margin:0 auto;background:var(--white);border-radius:var(--radius);padding:36px;box-shadow:var(--shadow);border:1px solid var(--border);}

/* Content styles */
.lesson-content-area h1{text-align:center;color:#fff;font-family:'Manrope',sans-serif;font-size:32px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;min-height:150px;padding:28px;background:var(--grad);border-radius:var(--radius);border-bottom:4px solid var(--gold);margin:0 0 30px;text-shadow:0 1px 2px rgba(0,0,0,.2);}
.lesson-content-area h2{color:var(--p1);font-size:26px;margin:28px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--p1);}
.lesson-content-area h2+p:first-letter{float:left;font-size:3.6em;line-height:.9;padding-right:10px;font-weight:bold;color:var(--p1);}
.lesson-content-area p{margin:14px 0;text-align:justify;font-family:'Source Serif 4',serif;font-size:17px;line-height:1.8;}
.lesson-content-area img{max-width:100%;height:auto;border-radius:8px;margin:18px 0;box-shadow:0 3px 12px rgba(0,0,0,.08);}
.lesson-content-area .video-container{position:relative;padding-bottom:56.25%;height:0;margin:18px 0;border-radius:8px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.08);}
.lesson-content-area .video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;}
.lesson-content-area .dica-destacada{background:#e8eef8;padding:22px;border-radius:10px;border-left:4px solid var(--p1);font-weight:500;margin:22px 0;font-size:15px;}
.lesson-content-area .dica-destacada::before{content:"💡 Dica: ";font-weight:bold;color:var(--p1);}
.lesson-content-area .pergunta-direta{margin:22px 0;padding:18px;background:#f3f5f9;border-left:4px solid var(--p2);border-radius:10px;font-weight:600;color:var(--p2);}
.lesson-content-area .papel-resposta{display:block;width:100%;min-height:140px;padding:14px;font-family:'Source Serif 4',serif;font-size:15px;line-height:30px;border:1.5px solid var(--border);border-radius:8px;outline:none;background:#fff;resize:vertical;margin:12px 0;transition:border-color .15s;}
.lesson-content-area .papel-resposta:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(79,70,229,.08);}
.lesson-content-area .quiz-card{margin:22px 0;padding:22px;border-radius:10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1.5px solid var(--border);}
.lesson-content-area .quiz-header{font-weight:700;margin-bottom:10px;color:var(--p1);font-size:12.5px;letter-spacing:.2px;}
.lesson-content-area .quiz-enunciado{font-size:15px;color:#555;font-style:italic;margin-bottom:8px;}
.lesson-content-area .quiz-pergunta{font-size:17px;font-weight:600;color:#333;margin-bottom:14px;}
.lesson-content-area .quiz-image{max-width:100%;border-radius:8px;margin:8px 0;}
.lesson-content-area .option-label{display:block;margin:8px 0;padding:12px;border-radius:8px;border:1.5px solid var(--border);cursor:pointer;transition:all .15s;background:#fff;}
.lesson-content-area .option-label:hover{border-color:var(--p1);background:#e8eef8;}
.lesson-content-area .option-label.correct{background:#e6f4ea;border-color:var(--green);}
.lesson-content-area .option-label.incorrect{background:#f8e9e7;border-color:var(--red);}
.lesson-content-area .option-input{margin-right:8px;}
.lesson-content-area .quiz-actions{margin-top:14px;display:flex;gap:10px;align-items:center;}
.lesson-content-area .quiz-result{font-weight:700;font-size:14px;}
.lesson-content-area .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;background:var(--grad);color:#fff;}

.sync-bar{background:var(--dark);color:rgba(255,255,255,.8);text-align:center;padding:7px;font-size:12px;flex-shrink:0;}
.sync-bar.syncing{background:var(--p1);}
.sync-bar.saved{background:var(--green);}

/* ── Grades table ── */
.grades-table{width:100%;border-collapse:collapse;font-size:13px;}
.grades-table th{background:var(--dark);color:rgba(255,255,255,.8);padding:11px 14px;text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.2px;}
.grades-table td{padding:10px 14px;border-bottom:1px solid var(--border);}
.grades-table tr:hover td{background:#f6f7f9;}
.grade-val{font-family:'Manrope',sans-serif;font-size:18px;font-weight:800;color:var(--p1);}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state .es-icon{font-size:48px;margin-bottom:14px;}
.empty-state h3{font-family:'Manrope',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px;}
.hidden{display:none!important;}

/* ── Hamburger ── */
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:7px;border:none;background:transparent;flex-shrink:0;}
.hamburger span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px;transition:all .25s;}
.hamburger.active span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hamburger.active span:nth-child(2){opacity:0;}
.hamburger.active span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:499;backdrop-filter:blur(2px);}
.sidebar-backdrop.open{display:block;}

@media(max-width:900px){
  .hamburger{display:flex;}
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:500;transition:left .25s ease;}
  .sidebar.open{left:0;box-shadow:8px 0 28px rgba(0,0,0,.22);}
  .main{width:100%;}
  .content{padding:14px;}
  .cards-grid{grid-template-columns:1fr 1fr;}
  .topbar{padding:0 14px;}
  .topbar h2{font-size:15px;}
  .list-item{flex-wrap:wrap;gap:5px;}
  .lesson-body{padding:14px 8px;}
  .lesson-content-area{padding:18px 14px;}
  .lesson-topbar{padding:0 10px;gap:7px;}
  .lesson-topbar h2{font-size:14px;}
  .grades-table th,.grades-table td{padding:7px 9px;font-size:12px;}
}
@media(max-width:480px){
  .cards-grid{grid-template-columns:1fr;}
  .lesson-content-area h1{font-size:22px;min-height:110px;}
  .lesson-content-area h2{font-size:20px;}
  .lesson-content-area p{font-size:15px;}
}
.loading{text-align:center;padding:36px;color:var(--muted);}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#12182a;color:#fff;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;animation:toastIn .25s ease;pointer-events:none;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
/* ── Refinamentos globais ── */
::selection{background:rgba(28,59,107,.18);}
*:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.sidebar::-webkit-scrollbar,.content::-webkit-scrollbar,.lesson-body::-webkit-scrollbar{width:8px;}
.sidebar::-webkit-scrollbar-track,.content::-webkit-scrollbar-track,.lesson-body::-webkit-scrollbar-track{background:transparent;}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px;}
.content::-webkit-scrollbar-thumb,.lesson-body::-webkit-scrollbar-thumb{background:rgba(15,23,42,.14);border-radius:8px;}
.logo-icon-box{background:var(--grad);box-shadow:0 0 0 1px rgba(255,255,255,.08);}
.sidebar-logo span{color:var(--gold);opacity:.85;}
</style>

</head>
<body>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-row">
      <div class="logo-icon-box"><i class="ti ti-school"></i></div>
      <div>
        <h1>EduAVA</h1>
        <span>Painel do Aluno</span>
      </div>
    </div>
  </div>
  <div class="user-card">
    <div class="user-avatar" id="sidebarAvatar">?</div>
    <div>
      <div class="uname" id="sidebarNome">Carregando...</div>
      <div class="urole">Estudante</div>
    </div>
  </div>
  <div class="sidebar-section">Menu</div>
  <div class="nav-item active" onclick="showSection('dashboard')" id="nav-dashboard">
    <i class="ti ti-home"></i> Início
  </div>
  <div class="nav-item" onclick="showSection('notas')" id="nav-notas">
    <i class="ti ti-chart-bar"></i> Minhas Notas
  </div>
  <div class="sidebar-section" id="turmasNavSection" style="display:none">Turmas</div>
  <div id="turmasNavList"></div>
  <div class="sidebar-bottom">
    <button class="btn-join" onclick="openOverlay('overlayJoin')">+ Entrar em Turma</button>
    <button class="btn-logout" onclick="logout()"><i class="ti ti-logout"></i> Sair</button>
  </div>
</nav>

<!-- Sidebar backdrop (mobile) -->
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <h2 id="pageTitle">Início</h2>
    <div class="topbar-actions" id="topbarActions"></div>
  </div>
  <div class="content" id="mainContent">
    <div class="loading">Carregando...</div>
  </div>
</div>

<!-- Lesson Viewer -->
<div class="lesson-viewer" id="lessonViewer">
  <div class="lesson-topbar">
    <button class="btn btn-ghost btn-sm" onclick="closeLesson()"><i class="ti ti-arrow-left"></i> Voltar</button>
    <h2 id="lessonTitle">Aula</h2>
    <div id="syncStatus" style="font-size:12px;color:var(--muted)">💾 Auto-salvar ativo</div>
  </div>
  <div id="syncBar" class="sync-bar hidden"></div>
  <div class="lesson-body">
    <div class="lesson-content-area" id="lessonContentArea"></div>
  </div>
</div>

<!-- Overlay Entrar em Turma -->
<div class="overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;backdrop-filter:blur(4px);align-items:center;justify-content:center;" id="overlayJoin">
  <div style="background:var(--white);border-radius:16px;padding:28px;width:90%;max-width:440px;animation:popIn .2s ease;">
    <h2 style="font-family:'Manrope',sans-serif;font-size:20px;font-weight:700;color:var(--dark);margin-bottom:8px;">🔑 Entrar em Turma</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:18px">Peça o código da turma ao seu professor e insira abaixo.</p>
    <div style="margin-bottom:14px">
      <label style="display:block;font-weight:700;font-size:11px;color:var(--text);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px">Código da Turma</label>
      <input type="text" id="joinCodigo" placeholder="Ex: ABC123" style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:22px;letter-spacing:4px;font-weight:700;text-transform:uppercase;outline:none;transition:border-color .15s;" onfocus="this.style.borderColor='var(--p1)'" onblur="this.style.borderColor='var(--border)'">
    </div>
    <div class="err" id="joinErr" style="color:var(--red);font-size:12px;margin-top:4px;display:none;"></div>
    <div style="display:flex;gap:8px;margin-top:18px;">
      <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="joinTurma()">Entrar</button>
      <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="closeOverlay('overlayJoin')">Cancelar</button>
    </div>
  </div>
</div>

<style>
.overlay.open{display:flex!important;}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
</style>

<script>
// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let API  = localStorage.getItem('ava_api') || '';
let user = JSON.parse(localStorage.getItem('ava_user') || 'null');
let turmas = [];
let aulaAberta = null;
let syncTimer  = null;
let pendingSync = {};
let emailPrefix = '';

async function post(payload) {
  const r = await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
  return r.json();
}

function toast(msg) {
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),2800);
}

// ═══════════════════════════════════════════════
// SIDEBAR MOBILE
// ═══════════════════════════════════════════════
function toggleSidebar() {
  const sb  = document.getElementById('sidebar');
  const btn = document.getElementById('hamburgerBtn');
  const bk  = document.getElementById('sidebarBackdrop');
  sb.classList.toggle('open');
  btn.classList.toggle('active');
  bk.classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar')?.classList.remove('open');
  document.getElementById('hamburgerBtn')?.classList.remove('active');
  document.getElementById('sidebarBackdrop')?.classList.remove('open');
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
window.addEventListener('load', async () => {
  if (!user || user.tipo !== 'aluno') { window.location.href='index.html'; return; }
  document.getElementById('sidebarNome').textContent = user.nome;
  document.getElementById('sidebarAvatar').textContent = user.nome[0].toUpperCase();
  emailPrefix = btoa(user.email) + '_';
  await loadTurmas();
  showSection('dashboard');
});

function logout() { localStorage.removeItem('ava_user'); window.location.href='index.html'; }

function setActive(id) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById('nav-'+id); if(el) el.classList.add('active');
}

// ═══════════════════════════════════════════════
// TURMAS
// ═══════════════════════════════════════════════
async function loadTurmas() {
  const data = await post({ action:'getTurmas', email: user.email });
  turmas = data.turmas || [];
  renderTurmasNav();
}

function renderTurmasNav() {
  const list=document.getElementById('turmasNavList');
  const sec=document.getElementById('turmasNavSection');
  if(!turmas.length){list.innerHTML='';sec.style.display='none';return;}
  sec.style.display='block';
  list.innerHTML=turmas.map(t=>`
    <div class="nav-turma-item" onclick="openTurma('${t.id}')" id="navt-${t.id}">${t.nome}</div>
  `).join('');
}

async function joinTurma() {
  const codigo=document.getElementById('joinCodigo').value.trim().toUpperCase();
  const errEl =document.getElementById('joinErr');
  errEl.style.display='none';
  if(!codigo){errEl.textContent='Digite o código.';errEl.style.display='block';return;}
  const data = await post({ action:'joinTurma', aluno_email:user.email, codigo });
  if(data.error){errEl.textContent=data.error;errEl.style.display='block';return;}
  toast('✅ Matriculado em: '+data.turma);
  document.getElementById('joinCodigo').value='';
  closeOverlay('overlayJoin');
  await loadTurmas();
  showSection('dashboard');
}

// ═══════════════════════════════════════════════
// SECTIONS
// ═══════════════════════════════════════════════
function showSection(section, param) {
  closeSidebar();
  document.getElementById('pageTitle').textContent = 'Carregando...';
  document.getElementById('topbarActions').innerHTML = '';
  document.querySelectorAll('.nav-turma-item').forEach(n=>n.classList.remove('active'));

  switch(section) {
    case 'dashboard':
      setActive('dashboard');
      document.getElementById('pageTitle').textContent = 'Início';
      renderDashboard(); break;
    case 'notas':
      setActive('notas');
      document.getElementById('pageTitle').textContent = 'Minhas Notas';
      renderNotas(); break;
    case 'turma':
      document.getElementById('pageTitle').textContent = param.nome;
      const nav=document.getElementById('navt-'+param.id); if(nav) nav.classList.add('active');
      renderAulas(param); break;
  }
}

// ═══════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════
function renderDashboard() {
  document.getElementById('mainContent').innerHTML = `
    <div style="font-family:'Manrope',sans-serif;font-size:20px;font-weight:700;color:var(--dark);margin-bottom:20px">
      Olá, ${user.nome.split(' ')[0]}! 👋
    </div>
    <div class="cards-grid">
      <div class="stat-card"><div class="stat-icon blue"><i class="ti ti-school"></i></div><div class="stat-info"><div class="num">${turmas.length}</div><div class="lbl">Turmas</div></div></div>
    </div>
    ${turmas.length ? `
      <div class="section-header"><h3>Suas Turmas</h3></div>
      <div class="cards-grid">
        ${turmas.map(t=>`
          <div class="turma-card" onclick="openTurma('${t.id}')">
            <h3>${t.nome}</h3>
            <div class="tm">📖 Clique para ver as aulas</div>

function openTurma(id) {
  const t = turmas.find(t=>t.id===id);
  if (t) showSection('turma', t);
}

// ═══════════════════════════════════════════════
// AULAS
// ═══════════════════════════════════════════════
async function renderAulas(turma) {
  document.getElementById('mainContent').innerHTML = '<div class="loading">Carregando aulas...</div>';
  const data = await post({ action:'getAulas', turma_id: turma.id });
  const aulas = (data.aulas||[]).filter(a=>a.status==='publicada');

  document.getElementById('mainContent').innerHTML = `
    <div class="section-header"><h3>📖 Aulas de ${turma.nome}</h3></div>
    <div class="list-card">
      ${aulas.length ? aulas.map(a=>`
        <div class="list-item" style="cursor:pointer" onclick="abrirAula('${a.id}','${escJ(a.titulo)}','${a.file_id||''}','${turma.id}')">
          <div class="list-item-icon"><i class="ti ti-file-text"></i></div>
          <div class="list-item-info">
            <div class="title">${a.titulo}</div>
            <div class="sub">${a.materia||'Sem matéria'} · ${new Date(a.created_at).toLocaleDateString('pt-BR')}</div>
          </div>
          <span class="badge badge-blue">→ Abrir</span>
        </div>
      `).join('') : '<div class="empty-state" style="padding:28px"><div class="es-icon">📄</div><h3>Nenhuma aula disponível</h3></div>'}
    </div>
  `;
}

function escJ(s) { return String(s||'').replace(/'/g,"\\'").replace(/"/g,'\\"'); }

// ═══════════════════════════════════════════════
// LESSON VIEWER
// ═══════════════════════════════════════════════
async function abrirAula(id, titulo, file_id, turma_id) {
  closeSidebar();
  toast('Abrindo aula...');
  const data = await post({ action:'getAula', id });
  if (data.error) { toast('Erro: '+data.error); return; }

  aulaAberta = { id, titulo, turma_id };

  // ── Tutora IA: avisa o widget qual aula/turma o aluno está vendo agora ──
  if (window.profiaSetContexto) {
    const turmaObj = turmas.find(t => t.id === turma_id);
    window.profiaSetContexto(turmaObj ? turmaObj.nome : '', titulo);
  }

  document.getElementById('lessonTitle').textContent = titulo;
  document.getElementById('lessonViewer').classList.add('open');

  const respData = await post({ action:'getRespostas', aluno_email: user.email, aula_id: id });
  const respostas = respData.respostas || [];
  respostas.forEach(r => localStorage.setItem(emailPrefix + r.chave, r.valor));

  const area = document.getElementById('lessonContentArea');
  area.innerHTML = data.aula.html || '<p style="color:var(--muted)">Aula sem conteúdo.</p>';

  area.querySelectorAll('.papel-resposta').forEach(ta => {
    const chave = ta.getAttribute('data-chave');
    if (chave && localStorage.getItem(emailPrefix + chave)) ta.value = localStorage.getItem(emailPrefix + chave);
    ta.addEventListener('input', () => {
      if (chave) {
        localStorage.setItem(emailPrefix + chave, ta.value);
        scheduleSync(chave, ta.value, 'resposta');
      }
    });
  });

  area.querySelectorAll('.quiz-card').forEach(card => {
    const qid = card.getAttribute('data-quiz-id'); if (!qid) return;
    const key = 'quiz_answer_'+qid;
    card.querySelectorAll('input[type=radio]').forEach(r => {
      r.addEventListener('change', e => {
        localStorage.setItem(emailPrefix + key, e.target.value);
        scheduleSync(key, e.target.value, 'quiz');
      });
    });
    const saved = localStorage.getItem(emailPrefix + key);
    if (saved) { const r=card.querySelector(`input[value="${saved}"]`); if(r) r.checked=true; }
  });

  area.querySelectorAll('[onclick^="verificarQuiz"]').forEach(btn => {
    btn.onclick = () => verificarQuiz(btn);
  });
}

function verificarQuiz(btn) {
  const qid=btn.getAttribute('data-quiz-id');
  const container=btn.closest('.quiz-card'); if(!container) return;
  const resultBox=container.querySelector(`.quiz-result[data-result-for="${qid}"]`)||container.querySelector('.quiz-result');
  container.querySelectorAll('.option-label').forEach(l=>l.classList.remove('correct','incorrect'));
  const correctR=Array.from(container.querySelectorAll('input[type=radio]')).find(r=>r.hasAttribute('data-correct'));
  const selected=container.querySelector('input[type=radio]:checked');
  if(!selected){if(resultBox){resultBox.textContent='⚠️ Escolha uma opção';resultBox.style.color='#b3690e';} return;}
  if(correctR) correctR.closest('.option-label')?.classList.add('correct');
  const selLabel=selected.closest('.option-label');
  if(selLabel&&!selected.hasAttribute('data-correct')) selLabel.classList.add('incorrect');
  const key='quiz_answer_'+qid;
  localStorage.setItem(emailPrefix + key, selected.value);
  scheduleSync(key, selected.value, 'quiz');
  if(resultBox){
    const ok=selected.hasAttribute('data-correct');
    resultBox.textContent=ok?'✅ Correto!':'❌ Incorreto';
    resultBox.style.color=ok?'#157347':'#b3261e';
  }
}
window.verificarQuiz = verificarQuiz;

function scheduleSync(chave, valor, tipo) {
  pendingSync[chave] = { chave, valor, tipo };
  clearTimeout(syncTimer);
  setSyncBar('syncing','⏳ Salvando...');
  syncTimer = setTimeout(doSync, 2000);
}

async function doSync() {
  const items = Object.values(pendingSync);
  if (!items.length || !aulaAberta) return;
  pendingSync = {};
  setSyncBar('syncing','☁️ Sincronizando...');
  try {
    for (const item of items) {
      await post({
        action:'saveResposta',
        aluno_email: user.email,
        aula_id: aulaAberta.id,
        chave: item.chave,
        valor: item.valor
      });
    }
    setSyncBar('saved','✅ Salvo na nuvem');
    setTimeout(()=>hideSyncBar(),2000);
  } catch(e) {
    setSyncBar('','⚠️ Erro ao salvar');
    setTimeout(()=>hideSyncBar(),3000);
  }
}

function setSyncBar(cls,msg) {
  const bar=document.getElementById('syncBar');
  bar.className='sync-bar'+(cls?' '+cls:'');
  bar.textContent=msg;
  bar.classList.remove('hidden');
}
function hideSyncBar() { document.getElementById('syncBar').classList.add('hidden'); }

async function closeLesson() {
  if (Object.keys(pendingSync).length) await doSync();
  document.getElementById('lessonViewer').classList.remove('open');
  document.getElementById('lessonContentArea').innerHTML='';
  aulaAberta = null;
}

// ═══════════════════════════════════════════════
// NOTAS
// ═══════════════════════════════════════════════
async function renderNotas() {
  document.getElementById('mainContent').innerHTML='<div class="loading">Carregando notas...</div>';
  const allNotas = [];
  for (const t of turmas) {
    const nd = await post({ action:'getNotas', turma_id: t.id });
    const minhas = (nd.notas||[]).filter(n=>n.aluno_email.toLowerCase()===user.email.toLowerCase());
    if (minhas.length) allNotas.push({ turma: t.nome, notas: minhas, turma_id: t.id });
  }

  if (!allNotas.length) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state"><div class="es-icon">📊</div><h3>Nenhuma nota lançada ainda</h3><p>As notas aparecerão aqui após o professor lançá-las.</p></div>`;
    return;
  }

  const aulaMap = {};
  for (const t of turmas) {
    const ad = await post({ action:'getAulas', turma_id: t.id });
    (ad.aulas||[]).forEach(a => aulaMap[a.id]=a.titulo);
  }

  document.getElementById('mainContent').innerHTML = allNotas.map(tg => {
    const media = (tg.notas.reduce((s,n)=>s+Number(n.nota||0),0)/tg.notas.length).toFixed(1);
    return `
      <div class="section-header"><h3>🏫 ${tg.turma}</h3><span class="badge badge-blue">Média: ${media}</span></div>
      <div class="list-card">
        <table class="grades-table" style="width:100%">
          <tr><th>Aula</th><th>Nota</th><th>Comentário</th><th>Data</th></tr>
          ${tg.notas.map(n=>`
            <tr>
              <td style="font-weight:700">${aulaMap[n.aula_id]||n.aula_id}</td>
              <td><span class="grade-val">${n.nota}</span></td>
              <td style="color:var(--muted)">${n.comentario||'—'}</td>
              <td style="color:var(--muted);font-size:12px">${n.data?new Date(n.data).toLocaleDateString('pt-BR'):'—'}</td>
            </tr>
          `).join('')}
        </table>
      </div>
    `;
  }).join('');
}

// ═══════════════════════════════════════════════
// OVERLAYS

function openOverlay(id)  { document.getElementById(id).classList.add('open'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(o=>{
  o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('open'); });
});
</script>

<script>

const PROF_IA_API = "https://script.google.com/macros/s/AKfycbw96Tgeh_rXmxOaRXoy2HmGvcFT97EH0ggiJVbnJNRDfT5k5_7J9qySuWeUNQyMux3PqQ/exec";

// ── estado ──
let profiaHistory = [];
let profiaBusy = false;
let profiaOpened = false;
let profiaAttachedImage = null;
let profiaContexto = { turma_nome: "", aula_titulo: "" };
let profiaMermaidLoaded = false;

// Chame isto (opcional) a partir do aluno.html quando o aluno abrir uma
// aula, para a Tutora saber o contexto: window.profiaSetContexto(turma, aula)
window.profiaSetContexto = function(turmaNome, aulaTitulo) {
  profiaContexto = { turma_nome: turmaNome || "", aula_titulo: aulaTitulo || "" };
  const st = document.getElementById('profiaStatus');
  if (st) st.textContent = aulaTitulo ? ('Sobre: ' + aulaTitulo) : 'Vamos pensar juntos?';
};

function toggleProfIA() {
  const panel = document.getElementById('profiaPanel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    loadMermaidIfNeeded();
    profiaUpdateVoiceBtn();
    if (!profiaOpened) {
      profiaOpened = true;
      const saudacao = 'Oi! Eu sou o Prof. TuTu. 🥸<br>Me conta: o que você está tentando resolver e o que você já tentou até agora?';
      profiaAddMsg('ai', saudacao);
      profiaSpeak(saudacao);
    }
    document.getElementById('profiaInput').focus();
  } else if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
    if (profiaListening && profiaRecognition) profiaRecognition.stop();
  }
}

function loadMermaidIfNeeded() {
  if (profiaMermaidLoaded || window.mermaid) { if (window.mermaid) profiaMermaidLoaded = true; return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload = () => { mermaid.initialize({ startOnLoad: false, theme: 'neutral' }); profiaMermaidLoaded = true; };
  document.body.appendChild(s);
}

function profiaQuick(text) {
  document.getElementById('profiaInput').value = text;
  profiaSend();
}
function profiaKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); profiaSend(); }
}
function profiaResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80) + 'px';
}

document.getElementById('profiaFileInput')?.addEventListener('change', function(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1000;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h*MAX/w); w = MAX; } else { w = Math.round(w*MAX/h); h = MAX; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      profiaAttachedImage = { dataUrl: canvas.toDataURL('image/jpeg', .82), name: 'exercicio.jpg' };
      document.getElementById('profiaFileBtn').classList.add('active');
      document.getElementById('profiaInput').placeholder = 'Descreva o que já tentou nessa foto…';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

async function profiaSend() {
  const inp = document.getElementById('profiaInput');
  const text = inp.value.trim();
  if ((!text && !profiaAttachedImage) || profiaBusy) return;

  let msgContent, displayHtml;
  if (profiaAttachedImage) {
    msgContent = [
      { type: 'image_url', image_url: { url: profiaAttachedImage.dataUrl, name: profiaAttachedImage.name } },
      { type: 'text', text: text || 'Aqui está o exercício que estou tentando resolver.' }
    ];
    displayHtml = `<img class="profia-img" src="${profiaAttachedImage.dataUrl}">` + (text ? '<br>' + profiaEsc(text) : '');
  } else {
    msgContent = text;
    displayHtml = profiaEsc(text);
  }

  profiaAddMsg('user', displayHtml);
  profiaHistory.push({ role: 'user', content: msgContent });

  inp.value = ''; profiaResize(inp);
  profiaAttachedImage = null;
  document.getElementById('profiaFileBtn').classList.remove('active');
  document.getElementById('profiaInput').placeholder = 'Conte o que você já tentou…';

  const typingId = profiaShowTyping();
  profiaBusy = true; document.getElementById('profiaSendBtn').disabled = true;

  try {
    const res = await fetch(PROF_IA_API, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'chat', messages: profiaHistory, contexto: profiaContexto })
    });
    const data = await res.json();
    profiaRemoveTyping(typingId);
    if (data.ok) {
      profiaAddMsg('ai', profiaFmt(data.reply || ''), data.card || '');
      profiaHistory.push({ role: 'assistant', content: data.reply || '' });
      profiaSpeak(data.reply || '');
    } else {
      const errMsg = data.error || 'Não consegui responder agora. Tenta de novo?';
      profiaAddMsg('ai', '⚠️ ' + profiaEsc(errMsg));
      profiaSpeak(errMsg);
    }
  } catch (err) {
    profiaRemoveTyping(typingId);
    profiaAddMsg('ai', '⚠️ Erro de conexão. Tenta de novo em instantes?');
    profiaSpeak('Erro de conexão. Tenta de novo em instantes?');
  } finally {
    profiaBusy = false; document.getElementById('profiaSendBtn').disabled = false;
  }
}

function profiaAddMsg(role, html, card) {
  const wrap = document.getElementById('profiaMsgs');
  const div = document.createElement('div');
  div.className = 'profia-msg ' + role;
  const b = document.createElement('div');
  b.className = 'profia-bubble';
  b.innerHTML = html;
  div.appendChild(b);
  wrap.appendChild(div);
  if (card) {
    const c = document.createElement('div');
    c.style.marginTop = '4px';
    c.innerHTML = card;
    wrap.appendChild(c);
    if (window.mermaid) { try { mermaid.run({ nodes: c.querySelectorAll('.mermaid') }); } catch(e) {} }
  }
  wrap.scrollTop = wrap.scrollHeight;
}

let profiaTc = 0;
function profiaShowTyping() {
  const id = 'ptp' + (++profiaTc);
  const wrap = document.getElementById('profiaMsgs');
  const d = document.createElement('div');
  d.className = 'profia-msg ai'; d.id = id;
  d.innerHTML = '<div class="profia-bubble"><div class="profia-dots"><span></span><span></span><span></span></div></div>';
  wrap.appendChild(d); wrap.scrollTop = wrap.scrollHeight;
  return id;
}
function profiaRemoveTyping(id) { const el = document.getElementById(id); if (el) el.remove(); }

function profiaFmt(t) {
  return String(t || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    .replace(/(https?:\/\/[^\s<>"]+)/g, '<a href="$1" target="_blank">$1</a>')
    .replace(/\n/g, '<br>');
}
function profiaEsc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ════════════════════════════════════════════════════════════
// ACESSIBILIDADE POR VOZ (gratuito, nativo do navegador)
// - Fala → texto: Web Speech API (SpeechRecognition)
// - Texto → fala: Web Speech API (SpeechSynthesis)
// Funciona bem no Chrome/Edge/Android. Em navegadores sem
// suporte (ex: Firefox desktop, alguns Safari antigos), os
// botões avisam a criança/professor em vez de travar a página.
// ════════════════════════════════════════════════════════════

let profiaVoiceEnabled = localStorage.getItem('profia_voice_enabled');
profiaVoiceEnabled = profiaVoiceEnabled === null ? true : profiaVoiceEnabled === 'true';
let profiaRecognition = null;
let profiaListening = false;
let profiaVoicesCache = [];

if ('speechSynthesis' in window) {
  profiaVoicesCache = window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => {
    profiaVoicesCache = window.speechSynthesis.getVoices();
  };
}

function profiaGetPtVoice() {
  if (!profiaVoicesCache.length) profiaVoicesCache = window.speechSynthesis.getVoices();
  if (!profiaVoicesCache.length) return null;
  return profiaVoicesCache.find(v => /pt[-_]br/i.test(v.lang)) ||
         profiaVoicesCache.find(v => /^pt/i.test(v.lang)) || null;
}

function profiaDefaultStatus() {
  return profiaContexto.aula_titulo ? ('Sobre: ' + profiaContexto.aula_titulo) : 'Vamos pensar juntos?';
}

function profiaUpdateVoiceBtn() {
  const btn = document.getElementById('profiaVoiceToggle');
  if (!btn) return;
  const supported = 'speechSynthesis' in window;
  btn.textContent = (profiaVoiceEnabled && supported) ? '🔊' : '🔇';
  btn.title = !supported
    ? 'Seu navegador não consegue ler as respostas em voz alta'
    : (profiaVoiceEnabled ? 'Voz ativada — toque para desativar' : 'Voz desativada — toque para ativar');
}

function profiaToggleVoice() {
  if (window.speechSynthesis && window.speechSynthesis.speaking) window.speechSynthesis.cancel();
  profiaVoiceEnabled = !profiaVoiceEnabled;
  localStorage.setItem('profia_voice_enabled', profiaVoiceEnabled);
  profiaUpdateVoiceBtn();
  toast(profiaVoiceEnabled ? '🔊 O Prof. TuTu vai falar as respostas' : '🔇 Voz desativada');
}

function profiaStripForSpeech(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = String(html || '');
  return (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
}

function profiaSpeak(rawText) {
  if (!profiaVoiceEnabled || !('speechSynthesis' in window)) return;
  const clean = profiaStripForSpeech(rawText);
  if (!clean) return;

  window.speechSynthesis.cancel(); // evita sobrepor falas
  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = 'pt-BR';
  utter.rate = 0.95;
  utter.pitch = 1.05;
  const voice = profiaGetPtVoice();
  if (voice) utter.voice = voice;

  const statusEl = document.getElementById('profiaStatus');
  utter.onstart = () => { if (statusEl) statusEl.textContent = '🗣️ Falando...'; };
  utter.onend   = () => { if (statusEl) statusEl.textContent = profiaDefaultStatus(); };
  utter.onerror = () => { if (statusEl) statusEl.textContent = profiaDefaultStatus(); };

  window.speechSynthesis.speak(utter);
}

function profiaGetRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  if (profiaRecognition) return profiaRecognition;

  profiaRecognition = new SR();
  profiaRecognition.lang = 'pt-BR';
  profiaRecognition.interimResults = false;
  profiaRecognition.maxAlternatives = 1;
  profiaRecognition.continuous = false;

  profiaRecognition.onstart = () => {
    profiaListening = true;
    const btn = document.getElementById('profiaMicBtn');
    if (btn) { btn.classList.add('listening'); btn.textContent = '🔴'; btn.title = 'Toque para parar de ouvir'; }
    const statusEl = document.getElementById('profiaStatus');
    if (statusEl) statusEl.textContent = '👂 Ouvindo... pode falar!';
  };

  profiaRecognition.onresult = (event) => {
    const said = event.results[0][0].transcript;
    const inp = document.getElementById('profiaInput');
    inp.value = said;
    profiaResize(inp);
    profiaSend();
  };

  profiaRecognition.onerror = (event) => {
    let msg = '🎤 Não consegui te ouvir. Tenta de novo?';
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
      msg = '🎤 Preciso de permissão para usar o microfone.';
    } else if (event.error === 'no-speech') {
      msg = '🎤 Não ouvi nada. Toque de novo e fale bem pertinho do microfone!';
    }
    toast(msg);
  };

  profiaRecognition.onend = () => {
    profiaListening = false;
    const btn = document.getElementById('profiaMicBtn');
    if (btn) { btn.classList.remove('listening'); btn.textContent = '🎤'; btn.title = 'Perguntar por voz'; }
    const statusEl = document.getElementById('profiaStatus');
    if (statusEl && statusEl.textContent === '👂 Ouvindo... pode falar!') statusEl.textContent = profiaDefaultStatus();
  };

  return profiaRecognition;
}

function profiaToggleListening() {
  const rec = profiaGetRecognition();
  if (!rec) { toast('🎤 Esse navegador não tem microfone por voz. Tenta usar o Chrome!'); return; }
  if (profiaListening) { rec.stop(); return; }
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  try { rec.start(); } catch (e) { /* reconhecimento já em andamento */ }
}
</script>
