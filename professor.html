<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAVA · Professor</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --purple-900: #26215C;
  --purple-800: #3C3489;
  --purple-600: #534AB7;
  --purple-400: #7F77DD;
  --purple-200: #AFA9EC;
  --purple-100: #CECBF6;
  --purple-50:  #EEEDFE;
  --teal-600:  #0F6E56;
  --teal-400:  #1D9E75;
  --teal-50:   #E1F5EE;
  --amber-50:  #FAEEDA;
  --amber-600: #854F0B;
  --amber-400: #BA7517;
  --green-50:  #EAF3DE;
  --green-600: #3B6D11;
  --red-50:    #FCEBEB;
  --red-400:   #E24B4A;
  --red-600:   #A32D2D;
  --text:      #1a1a2e;
  --muted:     #6b6b8a;
  --border:    rgba(0,0,0,.08);
  --bg:        #f4f3fb;
  --white:     #ffffff;
  --sidebar-w: 230px;
  --radius:    12px;
  --shadow:    0 2px 16px rgba(60,52,137,.07);
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; overflow:hidden; }

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w); background: var(--purple-900);
  display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
}
.sb-logo {
  padding: 22px 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,.07);
  display: flex; align-items: center; gap: 10px;
}
.sb-logo .logo-icon {
  width: 36px; height: 36px; background: rgba(255,255,255,.1);
  border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.sb-logo h1 {
  font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700;
  color: #fff; letter-spacing: -.5px;
}
.sb-logo small { font-size: 11px; color: rgba(255,255,255,.4); display: block; margin-top: 1px; }

.user-card {
  margin: 12px 12px 4px;
  padding: 11px 13px;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 10px;
}
.user-card .uname { font-size: 13px; font-weight: 600; color: #fff; }
.user-card .urole { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 2px; }

.sb-section {
  padding: 14px 16px 4px;
  font-size: 9px; font-weight: 700;
  color: rgba(255,255,255,.25);
  letter-spacing: 1.5px; text-transform: uppercase;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 18px; cursor: pointer;
  color: rgba(255,255,255,.55); font-size: 13px; font-weight: 500;
  transition: all .15s; position: relative;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item.active { background: var(--purple-800); color: #fff; font-weight: 600; }
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 7px; bottom: 7px;
  width: 3px; background: var(--purple-200); border-radius: 0 3px 3px 0;
}
.nav-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.nav-turma {
  padding: 8px 18px 8px 48px;
  font-size: 12px; color: rgba(255,255,255,.4); cursor: pointer; transition: all .15s;
}
.nav-turma:hover { color: rgba(255,255,255,.8); }
.nav-turma.active { color: var(--purple-200); font-weight: 600; }

.sb-bottom { margin-top: auto; padding: 14px 12px; }
.btn-logout {
  width: 100%; padding: 10px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
  color: rgba(255,255,255,.5);
  border-radius: 9px; cursor: pointer;
  font-size: 13px; font-weight: 500; transition: all .2s;
}
.btn-logout:hover { background: rgba(220,38,38,.25); color: #fff; border-color: transparent; }

/* ── Main ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  background: var(--white); padding: 0 24px; height: 58px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.topbar h2 { font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600; color: var(--purple-900); }
.topbar-actions { display: flex; gap: 8px; }
.content { flex: 1; overflow-y: auto; padding: 24px; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px; border: none; border-radius: 9px;
  cursor: pointer; font-size: 13px; font-weight: 600;
  transition: all .2s; font-family: 'DM Sans', sans-serif;
}
.btn-primary { background: var(--purple-800); color: #fff; }
.btn-primary:hover { background: var(--purple-900); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(60,52,137,.25); }
.btn-ghost { background: var(--purple-50); color: var(--purple-800); }
.btn-ghost:hover { background: var(--purple-100); }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--muted); }
.btn-outline:hover { border-color: var(--purple-400); color: var(--purple-800); }
.btn-danger { background: var(--red-50); color: var(--red-600); }
.btn-danger:hover { background: var(--red-400); color: #fff; }
.btn-success { background: var(--teal-600); color: #fff; }
.btn-success:hover { background: var(--teal-400); }
.btn-sm { padding: 7px 13px; font-size: 12px; }

/* ── Cards grid ── */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 14px; margin-bottom: 24px; }
.stat-card {
  background: var(--white); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 18px 16px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: var(--shadow);
}
.stat-icon {
  width: 44px; height: 44px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.stat-icon.purple { background: var(--purple-50); }
.stat-icon.teal   { background: var(--teal-50); }
.stat-icon.amber  { background: var(--amber-50); }
.stat-num { font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 700; color: var(--purple-900); line-height: 1; }
.stat-lbl { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* ── Section header ── */
.sec-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sec-hdr h3 { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 600; color: var(--purple-900); }

/* ── Turma cards ── */
.turmas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 14px; margin-bottom: 24px; }
.turma-card {
  background: var(--white); border-radius: var(--radius);
  border: 1.5px solid var(--border); padding: 18px 18px 16px;
  cursor: pointer; transition: all .2s; box-shadow: var(--shadow);
}
.turma-card:hover { border-color: var(--purple-400); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(60,52,137,.12); }
.turma-card h3 { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 600; color: var(--purple-900); margin-bottom: 6px; }
.turma-card .tm-meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.turma-code {
  display: inline-block; padding: 4px 10px;
  background: var(--purple-50); color: var(--purple-800);
  border-radius: 20px; font-size: 11px; font-weight: 700;
  letter-spacing: 1.5px;
}
.turma-card-add {
  background: transparent; border: 1.5px dashed #ccc;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; min-height: 110px; cursor: pointer; transition: all .2s;
}
.turma-card-add:hover { border-color: var(--purple-400); background: var(--purple-50); }
.turma-card-add .add-icon { font-size: 28px; }
.turma-card-add p { font-size: 13px; font-weight: 600; color: var(--muted); }

/* ── List card ── */
.list-card {
  background: var(--white); border-radius: var(--radius);
  border: 1px solid var(--border); overflow: hidden;
  margin-bottom: 16px; box-shadow: var(--shadow);
}
.list-card-hdr {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.list-card-hdr h3 { font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 600; }
.list-item {
  padding: 13px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; transition: background .12s;
}
.list-item:last-child { border-bottom: none; }
.list-item:hover { background: var(--bg); }
.li-icon {
  width: 36px; height: 36px; border-radius: 9px;
  background: var(--bg); display: flex; align-items: center;
  justify-content: center; font-size: 18px; flex-shrink: 0;
}
.li-info { flex: 1; min-width: 0; }
.li-info .title { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-info .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.li-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ── Badges ── */
.badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge-green  { background: var(--green-50); color: var(--green-600); }
.badge-amber  { background: var(--amber-50); color: var(--amber-600); }
.badge-purple { background: var(--purple-50); color: var(--purple-800); }
.badge-gray   { background: #f0eff8; color: var(--muted); }

/* ── Code box ── */
.code-box {
  background: var(--purple-50); border: 1px solid var(--purple-100);
  border-radius: 11px; padding: 16px 18px; margin-bottom: 20px;
  display: flex; align-items: center; gap: 16px;
}
.code-box .code-val {
  font-family: 'Sora', sans-serif; font-size: 30px; font-weight: 800;
  color: var(--purple-800); letter-spacing: 5px;
}
.code-box .code-label { font-size: 13px; font-weight: 600; color: var(--purple-900); }
.code-box .code-hint { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

/* ── Aluno row ── */
.aluno-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 18px; border-bottom: 1px solid var(--border);
}
.aluno-row:last-child { border-bottom: none; }
.aluno-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--purple-800); display: flex; align-items: center;
  justify-content: center; color: #fff; font-weight: 700; font-size: 14px; flex-shrink: 0;
}
.aluno-info { flex: 1; }
.aluno-info .an { font-size: 14px; font-weight: 600; }
.aluno-info .ae { font-size: 12px; color: var(--muted); margin-top: 1px; }

/* ── Grades table ── */
.grades-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.grades-table th {
  background: var(--purple-900); color: rgba(255,255,255,.75);
  padding: 11px 14px; text-align: left;
  font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
}
.grades-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); }
.grades-table tr:hover td { background: var(--bg); }
.grade-input {
  width: 68px; padding: 6px 9px; border: 1.5px solid var(--border);
  border-radius: 7px; font-size: 13px; text-align: center; outline: none;
  transition: border-color .2s;
}
.grade-input:focus { border-color: var(--purple-400); }
.nota-auto   { background: var(--purple-50); color: var(--purple-800); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }
.nota-manual { background: var(--teal-50);   color: var(--teal-600);   font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }

/* ── Correção ── */
.corr-select {
  padding: 5px 8px; border: 1.5px solid var(--border);
  border-radius: 7px; font-size: 12px; font-weight: 600;
  outline: none; cursor: pointer; background: var(--white); color: var(--text);
}
.corr-select.correto   { border-color: var(--teal-400);  background: var(--teal-50);  color: var(--teal-600); }
.corr-select.parcial   { border-color: #EF9F27;           background: var(--amber-50); color: var(--amber-600); }
.corr-select.incorreto { border-color: var(--red-400);   background: var(--red-50);   color: var(--red-600); }

.calc-bar {
  background: var(--purple-900); border-radius: 11px;
  padding: 14px 18px; display: flex; align-items: center;
  justify-content: space-between; margin-top: 18px; gap: 12px;
}
.calc-bar p { color: rgba(255,255,255,.75); font-size: 13px; flex: 1; line-height: 1.5; }

/* ── Builder ── */
.builder-meta {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 12px 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.builder-meta select, .builder-meta input {
  padding: 8px 12px; border: 1.5px solid #e8e6f5;
  border-radius: 8px; font-size: 13px; outline: none;
  font-family: 'DM Sans', sans-serif; color: var(--text);
  background: var(--bg);
}
.builder-meta select:focus, .builder-meta input:focus { border-color: var(--purple-400); background: #fff; }
.builder-meta .meta-label { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.builder-toolbar {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
.builder-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 12px; background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text);
  transition: all .15s; white-space: nowrap;
}
.builder-btn:hover { border-color: var(--purple-400); color: var(--purple-800); background: var(--purple-50); }
.builder-btn .bi { font-size: 15px; }
.builder-canvas { flex: 1; overflow-y: auto; padding: 28px; background: var(--bg); }
.builder-editor {
  background: var(--white); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 40px; min-height: 500px; box-shadow: var(--shadow);
}
#visualizacao {
  font-family: 'Georgia', serif; font-size: 18px; line-height: 1.8;
  color: #333; min-height: 200px; outline: none;
}
#visualizacao:empty::before {
  content: 'Clique aqui e use os botões acima para adicionar conteúdo...';
  color: #ccc; font-style: italic; font-size: 16px;
}

/* Estilos do conteúdo da aula dentro do builder */
#visualizacao h1 {
  position: relative; text-align: center; color: #fff;
  font-size: 36px; font-weight: bold;
  display: flex; align-items: center; justify-content: center;
  min-height: 180px; padding: 30px;
  background: linear-gradient(135deg, var(--purple-800), var(--purple-600));
  border-radius: 12px; margin: 0 0 30px; text-shadow: 2px 2px 8px rgba(0,0,0,.3);
}
#visualizacao h2 {
  color: var(--purple-800); font-size: 28px; margin: 30px 0 15px;
  padding-bottom: 10px; border-bottom: 3px solid var(--purple-800);
}
#visualizacao h2+p:first-letter { float:left; font-size:3.8em; line-height:.9; padding-right:12px; font-weight:bold; color:var(--purple-800); }
#visualizacao p { margin: 15px 0; text-align: justify; }
#visualizacao img.media-element { margin: 20px 0; max-width: 100%; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,.1); }
#visualizacao .video-container { position:relative; padding-bottom:56.25%; height:0; margin:20px 0; border-radius:10px; overflow:hidden; }
#visualizacao .video-container iframe { position:absolute; top:0; left:0; width:100%; height:100%; }
#visualizacao .dica-destacada {
  background: var(--purple-50); padding: 22px; border-radius: 11px;
  border-left: 4px solid var(--purple-800); font-weight: 500; margin: 22px 0;
}
#visualizacao .dica-destacada::before { content: "💡 Dica: "; font-weight: bold; color: var(--purple-800); }
#visualizacao .pergunta-direta {
  margin: 22px 0; padding: 18px;
  background: var(--purple-50); border-left: 4px solid var(--purple-600);
  border-radius: 11px; font-weight: 600; color: var(--purple-800);
}
#visualizacao .papel-resposta {
  display: block; width: 100%; min-height: 150px; padding: 14px;
  font-family: 'Georgia', serif; font-size: 16px; line-height: 32px;
  border: 1.5px solid var(--border); border-radius: 10px; outline: none;
  background: #fff; resize: vertical; margin: 12px 0; transition: border-color .2s;
}
#visualizacao .papel-resposta:focus { border-color: var(--purple-400); box-shadow: 0 0 0 3px rgba(127,119,221,.1); }
#visualizacao .quiz-card {
  margin: 22px 0; padding: 22px; border-radius: 12px;
  background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.06);
  border: 1.5px solid var(--border);
}
#visualizacao .quiz-header { font-weight: bold; margin-bottom: 10px; color: var(--purple-600); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
#visualizacao .quiz-enunciado { font-size: 15px; color: #555; font-style: italic; margin-bottom: 10px; }
#visualizacao .quiz-pergunta { font-size: 17px; font-weight: 600; color: #333; margin-bottom: 14px; }
#visualizacao .quiz-image { max-width:100%; border-radius:10px; margin:10px 0; }
#visualizacao .option-label {
  display: block; margin: 9px 0; padding: 12px 14px;
  border-radius: 9px; border: 1.5px solid var(--border); cursor: pointer; transition: all .15s;
}
#visualizacao .option-label:hover { border-color: var(--purple-400); background: var(--purple-50); }
#visualizacao .option-label.correct { background: var(--teal-50); border-color: var(--teal-400); }
#visualizacao .option-label.incorrect { background: var(--red-50); border-color: var(--red-400); }
#visualizacao .quiz-actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
#visualizacao .quiz-result { font-weight: 700; font-size: 14px; }
#visualizacao .btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px;
  border: none; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600;
  background: var(--purple-800); color: #fff; transition: all .15s;
}

/* ── Overlay / Popup ── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 1000;
  backdrop-filter: blur(3px);
  align-items: center; justify-content: center;
}
.overlay.open { display: flex; }
.popup-box {
  background: var(--white); border-radius: 18px;
  padding: 30px; width: 90%; max-width: 500px;
  max-height: 90vh; overflow-y: auto;
  animation: popIn .22s cubic-bezier(.22,1,.36,1);
  border: 1px solid var(--border);
}
@keyframes popIn { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
.popup-box h2 { font-family:'Sora',sans-serif; font-size:20px; font-weight:700; color:var(--purple-900); margin-bottom:20px; }
.form-field { margin-bottom: 14px; }
.form-field label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.3px; }
.form-field input, .form-field select, .form-field textarea {
  width:100%; padding:10px 13px; border:1.5px solid #e8e6f5;
  border-radius:9px; font-size:14px; font-family:'DM Sans',sans-serif;
  color:var(--text); outline:none; background:#faf9fe; transition:border-color .2s;
}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus { border-color:var(--purple-400); background:#fff; }
.popup-actions { display:flex; gap:8px; margin-top:18px; }
.popup-actions .btn { flex:1; justify-content:center; }
.two-cols { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* Builder element popup */
.el-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:2000; backdrop-filter:blur(3px); }
.el-overlay.open { display:flex; align-items:center; justify-content:center; }
.el-popup {
  background:#fff; border-radius:16px; padding:26px;
  width:90%; max-width:520px; max-height:85vh; overflow-y:auto;
  border:1px solid var(--border);
}
.el-popup h2 { font-family:'Sora',sans-serif; font-size:18px; font-weight:700; margin-bottom:18px; color:var(--purple-900); }
.el-popup label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px; margin-top:12px; text-transform:uppercase; letter-spacing:.3px; }
.el-popup input[type=text],.el-popup textarea,.el-popup select {
  width:100%; padding:10px 13px; border:1.5px solid #e8e6f5;
  border-radius:9px; font-size:13px; outline:none; background:#faf9fe; font-family:'DM Sans',sans-serif;
}
.el-popup input[type=text]:focus,.el-popup textarea:focus { border-color:var(--purple-400); background:#fff; }
.el-popup-actions { display:flex; gap:8px; margin-top:18px; }
.el-popup-actions .btn { flex:1; justify-content:center; }

/* ── Estados ── */
.empty-state { text-align:center; padding:50px 20px; color:var(--muted); }
.empty-state .es-icon { font-size:48px; margin-bottom:14px; }
.empty-state h3 { font-family:'Sora',sans-serif; font-size:18px; font-weight:600; color:var(--text); margin-bottom:8px; }
.loading { text-align:center; padding:40px; color:var(--muted); font-size:14px; }
.hidden { display:none !important; }
.toast {
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--purple-900); color:#fff; padding:11px 22px;
  border-radius:10px; font-size:13px; font-weight:600; z-index:9999;
  animation:toastIn .25s ease; pointer-events:none;
}
@keyframes toastIn { from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)} }

/* ── Hamburger mobile ── */
.hamburger { display:none; flex-direction:column; gap:5px; cursor:pointer; padding:6px; border:none; background:transparent; flex-shrink:0; }
.hamburger span { display:block; width:20px; height:2px; background:var(--text); border-radius:2px; transition:all .25s; }
.hamburger.active span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
.hamburger.active span:nth-child(2) { opacity:0; }
.hamburger.active span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
.sidebar-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:499; }
.sidebar-backdrop.open { display:block; }

@media (max-width:900px) {
  .hamburger { display:flex; }
  .sidebar { position:fixed; left:-250px; top:0; bottom:0; z-index:500; transition:left .28s ease; }
  .sidebar.open { left:0; box-shadow:8px 0 30px rgba(0,0,0,.2); }
  .main { width:100%; }
  .content { padding:16px; }
  .stats-grid { grid-template-columns:1fr 1fr; }
  .turmas-grid { grid-template-columns:1fr 1fr; }
  .topbar { padding:0 14px; }
  .topbar h2 { font-size:15px; }
  .builder-meta { flex-wrap:wrap; gap:7px; padding:8px 12px; }
  .builder-meta .meta-label { display:none; }
  .builder-meta select,.builder-meta input { width:100%; flex:1 1 100%; }
  .builder-toolbar { gap:5px; padding:7px 10px; overflow-x:auto; flex-wrap:nowrap; }
  .builder-btn { font-size:11px; padding:6px 9px; flex-shrink:0; }
  .builder-canvas { padding:12px; }
  .builder-editor { padding:20px; }
  .list-item { flex-wrap:wrap; gap:6px; }
  .li-actions { width:100%; justify-content:flex-end; }
  .grades-table th,.grades-table td { padding:8px 10px; font-size:12px; }
}
@media (max-width:480px) {
  .stats-grid { grid-template-columns:1fr; }
  .turmas-grid { grid-template-columns:1fr; }
  .popup-box { padding:20px 16px; }
  .li-actions .btn { font-size:11px; padding:5px 8px; }
  .builder-btn .bi { display:none; }
}
</style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="sb-logo">
    <div class="logo-icon">📚</div>
    <div>
      <h1>EduAVA</h1>
      <small>Painel do Professor</small>
    </div>
  </div>
  <div class="user-card">
    <div class="uname" id="sidebarNome">Carregando...</div>
    <div class="urole">👩‍🏫 Professor(a)</div>
  </div>
  <div class="sb-section">Menu</div>
  <div class="nav-item active" onclick="showSection('dashboard')" id="nav-dashboard">
    <span class="nav-icon">🏠</span> Dashboard
  </div>
  <div class="nav-item" onclick="showSection('turmas')" id="nav-turmas">
    <span class="nav-icon">🏫</span> Minhas Turmas
  </div>
  <div class="nav-item" onclick="showSection('builder')" id="nav-builder">
    <span class="nav-icon">✏️</span> Criar / Editar Aula
  </div>
  <div class="sb-section" id="turmasNavSection" style="display:none">Turmas</div>
  <div id="turmasNavList"></div>
  <div class="sb-bottom">
    <button class="btn-logout" onclick="logout()">↩ Sair</button>
  </div>
</nav>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <h2 id="pageTitle">Dashboard</h2>
    <div class="topbar-actions" id="topbarActions"></div>
  </div>
  <div class="content" id="mainContent">
    <div class="loading">Carregando...</div>
  </div>
</div>

<!-- Overlay Criar Turma -->
<div class="overlay" id="overlayTurma">
  <div class="popup-box">
    <h2>🏫 Nova Turma</h2>
    <div class="form-field">
      <label>Nome da Turma</label>
      <input type="text" id="turmaNome" placeholder="Ex: 9º Ano A — Matemática 2025">
    </div>
    <div class="popup-actions">
      <button class="btn btn-primary" onclick="criarTurma()">Criar Turma</button>
      <button class="btn btn-outline" onclick="closeOverlay('overlayTurma')">Cancelar</button>
    </div>
  </div>
</div>

<!-- Overlay Notas -->
<div class="overlay" id="overlayNotas">
  <div class="popup-box" style="max-width:720px">
    <h2>📊 Lançar Notas</h2>
    <div id="notasContent"></div>
    <div class="popup-actions" style="margin-top:16px">
      <button class="btn btn-outline" onclick="closeOverlay('overlayNotas')">Fechar</button>
    </div>
  </div>
</div>

<!-- Overlay Ver Respostas -->
<div class="overlay" id="overlayRespostas">
  <div class="popup-box" style="max-width:800px;width:95%">
    <h2 id="overlayRespostasTitle">📋 Respostas dos Alunos</h2>
    <div id="respostasContent"><div class="loading">Carregando...</div></div>
    <div class="popup-actions" style="margin-top:18px">
      <button class="btn btn-outline" onclick="closeOverlay('overlayRespostas')">Fechar</button>
    </div>
  </div>
</div>

<!-- Builder Element Popups -->
<div class="el-overlay" id="elOverlay">
  <div class="el-popup" id="elPopupBox"></div>
</div>

<script>
// ═══════════════════════════════════════════════
// CONFIG & STATE
// ═══════════════════════════════════════════════
let API = localStorage.getItem('ava_api') || '';
let user = JSON.parse(localStorage.getItem('ava_user') || 'null');
let turmas = [];
let aulaAtual = null;
let turmaAtiva = null;
let aulas = [];
let _pendingTurmaId = null;

async function post(payload) {
  const r = await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
  return r.json();
}

function toast(msg) {
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),2800);
}

// ═══════════════════════════════════════════════
// SIDEBAR MOBILE
// ═══════════════════════════════════════════════
function toggleSidebar() {
  const sb=document.getElementById('sidebar'), btn=document.getElementById('hamburgerBtn'), bk=document.getElementById('sidebarBackdrop');
  sb.classList.toggle('open'); btn.classList.toggle('active'); bk.classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('hamburgerBtn').classList.remove('active');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
window.addEventListener('load', async () => {
  if (!user || user.tipo !== 'professor') { window.location.href='index.html'; return; }
  document.getElementById('sidebarNome').textContent = user.nome;
  await loadTurmas();
  showSection('dashboard');
});

function logout() { localStorage.removeItem('ava_user'); window.location.href='index.html'; }

function setActive(id) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById('nav-'+id); if(el) el.classList.add('active');
}

// ═══════════════════════════════════════════════
// TURMAS
// ═══════════════════════════════════════════════
async function loadTurmas() {
  const data=await post({action:'getTurmas',email:user.email});
  turmas=data.turmas||[];
  renderTurmasNav();
}

function renderTurmasNav() {
  const list=document.getElementById('turmasNavList'), sec=document.getElementById('turmasNavSection');
  if(!turmas.length){list.innerHTML='';sec.style.display='none';return;}
  sec.style.display='block';
  list.innerHTML=turmas.map(t=>`<div class="nav-turma" onclick="openTurma('${t.id}')" id="navt-${t.id}">${t.nome}</div>`).join('');
}

async function criarTurma() {
  const nome=document.getElementById('turmaNome').value.trim();
  if(!nome){toast('Digite o nome da turma.');return;}
  const data=await post({action:'createTurma',nome,professor_email:user.email});
  if(data.error){toast('Erro: '+data.error);return;}
  toast('✅ Turma criada! Código: '+data.codigo);
  document.getElementById('turmaNome').value='';
  closeOverlay('overlayTurma');
  await loadTurmas(); showSection('turmas');
}

async function deletarTurma(id) {
  if(!confirm('Excluir esta turma e todas as aulas? Essa ação não pode ser desfeita.')) return;
  await post({action:'deleteTurma',id});
  toast('Turma excluída.');
  await loadTurmas(); showSection('turmas');
}

function openTurma(id) {
  turmaAtiva=turmas.find(t=>t.id===id);
  showSection('turmaDetail');
}

// ═══════════════════════════════════════════════
// SECTIONS
// ═══════════════════════════════════════════════
function showSection(section) {
  closeSidebar();
  const content=document.getElementById('mainContent');
  const title=document.getElementById('pageTitle');
  const actions=document.getElementById('topbarActions');
  actions.innerHTML='';
  document.querySelectorAll('.nav-turma').forEach(n=>n.classList.remove('active'));

  switch(section) {
    case 'dashboard':
      setActive('dashboard'); title.textContent='Dashboard';
      renderDashboard(); break;
    case 'turmas':
      setActive('turmas'); title.textContent='Minhas Turmas';
      actions.innerHTML=`<button class="btn btn-primary btn-sm" onclick="openOverlay('overlayTurma')">+ Nova Turma</button>`;
      renderTurmas(); break;
    case 'turmaDetail':
      if(!turmaAtiva){showSection('turmas');return;}
      const navEl=document.getElementById('navt-'+turmaAtiva.id); if(navEl) navEl.classList.add('active');
      title.textContent=turmaAtiva.nome;
      actions.innerHTML=`
        <button class="btn btn-ghost btn-sm" onclick="showNotasModal('${turmaAtiva.id}')">📊 Notas</button>
        <button class="btn btn-danger btn-sm" onclick="deletarTurma('${turmaAtiva.id}')">🗑 Excluir</button>`;
      renderTurmaDetail(); break;
    case 'builder':
      setActive('builder'); title.textContent=aulaAtual?'Editando: '+aulaAtual.titulo:'Nova Aula';
      actions.innerHTML=`
        <button class="btn btn-outline btn-sm" onclick="salvarRascunho()">💾 Rascunho</button>
        <button class="btn btn-success btn-sm" onclick="publicarAula()">🚀 Publicar</button>`;
      renderBuilder(); break;
  }
}

// ═══════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════
function renderDashboard() {
  const totalAlunos=turmas.reduce((s,t)=>s+(Number(t.alunos_count)||0),0);
  document.getElementById('mainContent').innerHTML=`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon purple">🏫</div><div><div class="stat-num">${turmas.length}</div><div class="stat-lbl">Turmas</div></div></div>
      <div class="stat-card"><div class="stat-icon teal">👨‍🎓</div><div><div class="stat-num">${totalAlunos}</div><div class="stat-lbl">Alunos</div></div></div>
      <div class="stat-card"><div class="stat-icon amber">✏️</div><div><div class="stat-num" id="statAulas">—</div><div class="stat-lbl">Aulas Publicadas</div></div></div>
    </div>
    <div class="sec-hdr"><h3>Acesso Rápido</h3></div>
    <div class="turmas-grid">
      <div class="turma-card turma-card-add" onclick="openOverlay('overlayTurma')">
        <div class="add-icon">+</div><p>Nova Turma</p>
      </div>
      <div class="turma-card turma-card-add" onclick="novaAula()">
        <div class="add-icon">✏️</div><p>Criar Aula</p>
      </div>
    </div>
    ${turmas.length?`
    <div class="sec-hdr"><h3>Suas Turmas</h3></div>
    <div class="turmas-grid">
      ${turmas.map(t=>`
        <div class="turma-card" onclick="openTurma('${t.id}')">
          <h3>${t.nome}</h3>
          <div class="tm-meta">👥 ${t.alunos_count||0} alunos</div>
          <span class="turma-code">${t.codigo}</span>
        </div>`).join('')}
    </div>`:''}`;
}

// ═══════════════════════════════════════════════
// TURMAS LIST
// ═══════════════════════════════════════════════
function renderTurmas() {
  if(!turmas.length){
    document.getElementById('mainContent').innerHTML=`<div class="empty-state"><div class="es-icon">🏫</div><h3>Nenhuma turma ainda</h3><p>Crie sua primeira turma para começar.</p></div>`;
    return;
  }
  document.getElementById('mainContent').innerHTML=`
    <div class="turmas-grid">
      ${turmas.map(t=>`
        <div class="turma-card" onclick="openTurma('${t.id}')">
          <h3>${t.nome}</h3>
          <div class="tm-meta">👥 ${t.alunos_count||0} alunos</div>
          <span class="turma-code">🔑 ${t.codigo}</span>
        </div>`).join('')}
    </div>`;
}

// ═══════════════════════════════════════════════
// TURMA DETAIL
// ═══════════════════════════════════════════════
async function renderTurmaDetail() {
  document.getElementById('mainContent').innerHTML=`<div class="loading">Carregando dados da turma...</div>`;
  const [aulaData,alunoData]=await Promise.all([
    post({action:'getAulas',turma_id:turmaAtiva.id}),
    post({action:'getAlunos',turma_id:turmaAtiva.id})
  ]);
  aulas=aulaData.aulas||[];
  const alunos=alunoData.alunos||[];

  document.getElementById('mainContent').innerHTML=`
    <div class="stats-grid" style="margin-bottom:18px">
      <div class="stat-card"><div class="stat-icon purple">📖</div><div><div class="stat-num">${aulas.length}</div><div class="stat-lbl">Aulas</div></div></div>
      <div class="stat-card"><div class="stat-icon teal">👨‍🎓</div><div><div class="stat-num">${alunos.length}</div><div class="stat-lbl">Alunos</div></div></div>
    </div>

    <div class="code-box">
      <div>
        <div class="code-label">Código de acesso da turma</div>
        <div class="code-val">${turmaAtiva.codigo}</div>
        <div class="code-hint">Compartilhe com seus alunos para que possam se matricular.</div>
      </div>
    </div>

    <div class="sec-hdr">
      <h3>📖 Aulas</h3>
      <button class="btn btn-primary btn-sm" onclick="novaAula('${turmaAtiva.id}')">+ Nova Aula</button>
    </div>
    <div class="list-card">
      ${aulas.length?aulas.map(a=>`
        <div class="list-item">
          <div class="li-icon">📄</div>
          <div class="li-info">
            <div class="title">${a.titulo}</div>
            <div class="sub">${a.materia||'Sem matéria'} · ${new Date(a.created_at).toLocaleDateString('pt-BR')}</div>
          </div>
          <span class="badge ${a.status==='publicada'?'badge-green':'badge-amber'}">${a.status==='publicada'?'Publicada':'Rascunho'}</span>
          <div class="li-actions">
            <button class="btn btn-ghost btn-sm" onclick="verRespostas('${a.id}','${escJ(a.titulo)}')">👁 Respostas</button>
            <button class="btn btn-outline btn-sm" onclick="editarAula('${a.id}','${a.file_id||''}','${escJ(a.titulo)}','${a.materia||''}','${turmaAtiva.id}')">✏️ Editar</button>
            <button class="btn btn-danger btn-sm" onclick="deletarAula('${a.id}','${a.file_id||''}')">🗑</button>
          </div>
        </div>`).join(''):`<div class="empty-state" style="padding:28px"><div class="es-icon">📄</div><h3>Nenhuma aula</h3><p>Crie a primeira aula desta turma.</p></div>`}
    </div>

    <div class="sec-hdr" style="margin-top:22px"><h3>👥 Alunos</h3></div>
    <div class="list-card">
      ${alunos.length?alunos.map(a=>`
        <div class="aluno-row">
          <div class="aluno-avatar">${a.nome[0].toUpperCase()}</div>
          <div class="aluno-info"><div class="an">${esc(a.nome)}</div><div class="ae">${a.email}</div></div>
          <span class="badge badge-purple">Média: ${a.media}</span>
        </div>`).join(''):`<div class="empty-state" style="padding:28px"><div class="es-icon">👥</div><h3>Nenhum aluno matriculado</h3></div>`}
    </div>`;
}

// ═══════════════════════════════════════════════
// NOTAS
// ═══════════════════════════════════════════════
async function showNotasModal(turma_id) {
  openOverlay('overlayNotas');
  document.getElementById('notasContent').innerHTML='<div class="loading">Carregando...</div>';
  const [alunoData,aulaData,notaData]=await Promise.all([
    post({action:'getAlunos',turma_id}),
    post({action:'getAulas',turma_id}),
    post({action:'getNotas',turma_id})
  ]);
  const alunos=alunoData.alunos||[], aulasL=aulaData.aulas||[], notas=notaData.notas||[];
  if(!alunos.length||!aulasL.length){
    document.getElementById('notasContent').innerHTML='<p style="color:var(--muted)">Sem alunos ou aulas para lançar notas.</p>';
    return;
  }
  function getNotaObj(email,aula_id){return notas.find(n=>n.aluno_email.toLowerCase()===email.toLowerCase()&&n.aula_id===aula_id);}
  document.getElementById('notasContent').innerHTML=`
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px">
      Notas com <span class="nota-auto">AUTO</span> foram calculadas automaticamente.
      Você pode ajustá-las manualmente abaixo (0–10).
    </p>
    <div style="overflow-x:auto">
    <table class="grades-table">
      <tr><th>Aluno</th>${aulasL.map(a=>`<th>${a.titulo}</th>`).join('')}</tr>
      ${alunos.map(al=>`
        <tr>
          <td style="font-weight:600">${esc(al.nome)}</td>
          ${aulasL.map(a=>{
            const obj=getNotaObj(al.email,a.id);
            const val=obj?obj.nota:'';
            const tag=obj?.comentario==='__auto__'?`<span class="nota-auto">AUTO</span>`:(obj?`<span class="nota-manual">MANUAL</span>`:'');
            return `<td style="min-width:110px"><div style="display:flex;align-items:center;gap:5px">
              <input class="grade-input" type="number" min="0" max="10" step="0.1" value="${val}"
                onblur="salvarNotaManual('${al.email}','${a.id}','${turma_id}',this.value,this)">
              ${tag}</div></td>`;
          }).join('')}
        </tr>`).join('')}
    </table></div>
    <p style="font-size:12px;color:var(--muted);margin-top:12px">Edite e saia do campo para salvar. Use <strong>👁 Respostas</strong> para calcular automaticamente.</p>`;
}

async function salvarNotaManual(email,aula_id,turma_id,valor,inputEl) {
  if(valor==='') return;
  await post({action:'saveNota',aluno_email:email,aula_id,turma_id,nota:Number(valor).toFixed(1),comentario:''});
  const badge=inputEl?.parentElement?.querySelector('.nota-auto,.nota-manual');
  if(badge){badge.className='nota-manual';badge.textContent='MANUAL';}
  toast('Nota salva!');
}

async function calcularNotasAuto(aula_id) {
  const btn=document.getElementById('btnCalcAuto_'+aula_id);
  if(btn){btn.disabled=true;btn.textContent='Calculando...';}
  const [alunoData,aulaData]=await Promise.all([
    post({action:'getAlunos',turma_id:turmaAtiva.id}),
    post({action:'getAula',id:aula_id})
  ]);
  const alunos=alunoData.alunos||[], aulaHtml=aulaData.aula?.html||'';
  const parser=new DOMParser(), doc=parser.parseFromString(aulaHtml,'text/html');
  const perguntas=Array.from(doc.querySelectorAll('.pergunta-direta')).map(el=>({texto:el.textContent.trim(),chave:el.nextElementSibling?.getAttribute('data-chave')||''})).filter(p=>p.chave);
  const quizzes=Array.from(doc.querySelectorAll('.quiz-card')).map(el=>({id:el.getAttribute('data-quiz-id')||'',chave:'quiz_answer_'+(el.getAttribute('data-quiz-id')||''),corretaIdx:Array.from(el.querySelectorAll('input[type=radio]')).findIndex(r=>r.hasAttribute('data-correct'))})).filter(q=>q.id);
  const totalItens=perguntas.length+quizzes.length;
  if(!totalItens){toast('Esta aula não tem atividades para calcular nota.');return;}
  const respostasMap={};
  await Promise.all(alunos.map(async al=>{const r=await post({action:'getRespostas',aluno_email:al.email,aula_id});respostasMap[al.email]=r.respostas||[];}));
  let salvos=0;
  for(const al of alunos){
    const resps=respostasMap[al.email]||[];
    let pontos=0;
    quizzes.forEach(q=>{const r=resps.find(r=>r.chave===q.chave);if(r&&Number(r.valor)-1===q.corretaIdx)pontos+=1;});
    perguntas.forEach(p=>{const corrChave='corr_'+p.chave;const r=resps.find(r=>r.chave===corrChave);if(r?.valor==='correto')pontos+=1;else if(r?.valor==='parcial')pontos+=0.5;});
    const nota=Math.round((pontos/totalItens)*100)/10;
    await post({action:'saveNota',aluno_email:al.email,aula_id,turma_id:turmaAtiva.id,nota,comentario:'__auto__'});
    salvos++;
  }
  if(btn){btn.disabled=false;btn.textContent='🔄 Recalcular';}
  toast(`✅ Notas calculadas para ${salvos} aluno(s)!`);
}

async function salvarCorrecao(selectEl,aluno_email,aula_id,corrChave) {
  const valor=selectEl.value;
  selectEl.className='corr-select '+(valor==='correto'?'correto':valor==='parcial'?'parcial':'incorreto');
  await post({action:'saveResposta',aluno_email,aula_id,chave:corrChave,valor});
  toast('Correção salva!');
}

async function verRespostas(aula_id,titulo) {
  document.getElementById('overlayRespostasTitle').textContent='📋 Respostas — '+titulo;
  document.getElementById('respostasContent').innerHTML='<div class="loading">Carregando respostas...</div>';
  openOverlay('overlayRespostas');
  const [alunoData,aulaData]=await Promise.all([
    post({action:'getAlunos',turma_id:turmaAtiva.id}),
    post({action:'getAula',id:aula_id})
  ]);
  const alunos=alunoData.alunos||[], aulaHtml=aulaData.aula?.html||'';
  if(!alunos.length){document.getElementById('respostasContent').innerHTML='<p style="color:var(--muted)">Nenhum aluno matriculado.</p>';return;}
  const parser=new DOMParser(), doc=parser.parseFromString(aulaHtml,'text/html');
  const perguntas=Array.from(doc.querySelectorAll('.pergunta-direta')).map(el=>({texto:el.textContent.trim(),chave:el.nextElementSibling?.getAttribute('data-chave')||''})).filter(p=>p.chave);
  const quizzes=Array.from(doc.querySelectorAll('.quiz-card')).map(el=>({id:el.getAttribute('data-quiz-id')||'',pergunta:el.querySelector('.quiz-pergunta')?.textContent.trim()||'Quiz',opcoes:Array.from(el.querySelectorAll('.option-label')).map(o=>({texto:o.querySelector('span')?.textContent.trim()||'',correta:!!o.querySelector('[data-correct]')}))})).filter(q=>q.id);
  if(!perguntas.length&&!quizzes.length){document.getElementById('respostasContent').innerHTML='<p style="color:var(--muted)">Esta aula não possui atividades.</p>';return;}
  const respostasMap={};
  await Promise.all(alunos.map(async al=>{const r=await post({action:'getRespostas',aluno_email:al.email,aula_id});respostasMap[al.email]=r.respostas||[];}));
  let html='';
  if(perguntas.length){
    html+=`<h3 style="font-family:'Sora',sans-serif;font-size:15px;font-weight:600;color:var(--purple-900);margin:0 0 14px">✏️ Respostas Dissertativas</h3>`;
    perguntas.forEach(perg=>{
      html+=`<div style="background:var(--bg);border-radius:11px;padding:16px;margin-bottom:14px;border-left:3px solid var(--purple-600)">
        <div style="font-weight:600;color:var(--purple-800);margin-bottom:12px;font-size:14px">${esc(perg.texto)}</div>`;
      alunos.forEach(al=>{
        const resps=respostasMap[al.email]||[];
        const resp=resps.find(r=>r.chave===perg.chave);
        const valor=resp?.valor?.trim();
        const corrChave='corr_'+perg.chave;
        const corrResp=resps.find(r=>r.chave===corrChave);
        const corrVal=corrResp?.valor||'';
        const corrClass=corrVal==='correto'?'correto':corrVal==='parcial'?'parcial':corrVal==='incorreto'?'incorreto':'';
        html+=`<div style="display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border)">
          <div style="width:34px;height:34px;border-radius:50%;background:var(--purple-800);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0">${al.nome[0].toUpperCase()}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px;margin-bottom:4px">${esc(al.nome)}</div>
            <div style="font-size:13px;color:${valor?'var(--text)':'var(--muted)'};line-height:1.6;white-space:pre-wrap;background:${valor?'#fff':'transparent'};padding:${valor?'9px 12px':'0'};border-radius:8px;border:${valor?'1px solid var(--border)':'none'};margin-bottom:7px">${valor?esc(valor):'— Sem resposta'}</div>
            ${valor?`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span style="font-size:12px;font-weight:700;color:var(--muted)">Correção:</span>
              <select class="corr-select ${corrClass}" onchange="salvarCorrecao(this,'${al.email}','${aula_id}','${corrChave}')">
                <option value="" ${corrVal===''?'selected':''}>— Selecione</option>
                <option value="correto" ${corrVal==='correto'?'selected':''}>✅ Correto (100%)</option>
                <option value="parcial" ${corrVal==='parcial'?'selected':''}>⚠️ Parcialmente Correto (50%)</option>
                <option value="incorreto" ${corrVal==='incorreto'?'selected':''}>❌ Incorreto (0%)</option>
              </select></div>`:`<span style="font-size:12px;color:var(--muted);font-style:italic">Aluno ainda não respondeu</span>`}
          </div></div>`;
      });
      html+=`</div>`;
    });
  }
  if(quizzes.length){
    html+=`<h3 style="font-family:'Sora',sans-serif;font-size:15px;font-weight:600;color:var(--purple-900);margin:18px 0 14px">📊 Quizzes</h3>`;
    quizzes.forEach(quiz=>{
      const respostas=alunos.map(al=>{const r=(respostasMap[al.email]||[]).find(r=>r.chave==='quiz_answer_'+quiz.id);const idx=r?Number(r.valor)-1:-1;return{al,idx,opcao:quiz.opcoes[idx],acerto:quiz.opcoes[idx]?.correta};});
      const acertos=respostas.filter(r=>r.acerto).length, total=respostas.filter(r=>r.idx>=0).length;
      const pct=total>0?Math.round((acertos/total)*100):0;
      html+=`<div style="background:var(--bg);border-radius:11px;padding:16px;margin-bottom:14px;border-left:3px solid var(--purple-400)">
        <div style="font-weight:600;color:var(--purple-800);margin-bottom:4px;font-size:14px">${esc(quiz.pergunta)}</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:12px">✅ ${acertos} acerto(s) de ${total} · <strong style="color:${pct>=60?'var(--teal-600)':pct>=40?'var(--amber-600)':'var(--red-600)'}">${pct}%</strong></div>
        ${respostas.map(({al,idx,opcao,acerto})=>`
          <div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
            <div style="width:34px;height:34px;border-radius:50%;background:var(--purple-800);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0">${al.nome[0].toUpperCase()}</div>
            <div style="flex:1"><div style="font-weight:600;font-size:13px">${esc(al.nome)}</div><div style="font-size:12px;color:var(--muted)">${opcao?esc(opcao.texto):'— Sem resposta'}</div></div>
            <span style="font-size:18px">${idx<0?'⬜':acerto?'✅':'❌'}</span>
          </div>`).join('')}
      </div>`;
    });
  }
  html+=`<div class="calc-bar">
    <p>Após corrigir as dissertativas, clique para calcular e salvar a nota de aproveitamento (0–10) automaticamente para todos.</p>
    <button id="btnCalcAuto_${aula_id}" class="btn btn-primary btn-sm" onclick="calcularNotasAuto('${aula_id}')">🧮 Calcular Notas</button>
  </div>`;
  document.getElementById('respostasContent').innerHTML=html;
}

function novaAula(turma_id) { aulaAtual=null; _pendingTurmaId=turma_id||null; showSection('builder'); }

async function editarAula(id,file_id,titulo,materia,turma_id) {
  toast('Carregando aula...');
  const data=await post({action:'getAula',id});
  if(data.error){toast('Erro: '+data.error);return;}
  aulaAtual={id,file_id,titulo,materia,turma_id};
  showSection('builder');
  document.getElementById('builderTitulo').value=titulo;
  document.getElementById('builderMateria').value=materia;
  document.getElementById('builderTurmaId').value=turma_id;
  document.getElementById('visualizacao').innerHTML=data.aula.html||'';
  document.querySelectorAll('#visualizacao .quiz-card').forEach(c=>{
    const saved=localStorage.getItem('quiz_answer_'+c.dataset.quizId);
    if(saved){const r=c.querySelector(`input[value="${saved}"]`);if(r)r.checked=true;}
  });
}

async function deletarAula(id,file_id) {
  if(!confirm('Excluir esta aula?')) return;
  await post({action:'deleteAula',id,file_id});
  toast('Aula excluída.');
  if(turmaAtiva) renderTurmaDetail();
}

async function salvarRascunho() { await saveAulaWithStatus('rascunho'); }
async function publicarAula()   { await saveAulaWithStatus('publicada'); }

async function saveAulaWithStatus(status) {
  const titulo=document.getElementById('builderTitulo').value.trim();
  const materia=document.getElementById('builderMateria').value.trim();
  const turma_id=document.getElementById('builderTurmaId').value;
  if(!titulo){toast('Digite o título da aula.');return;}
  if(!turma_id){toast('Selecione a turma.');return;}
  const clone=document.getElementById('visualizacao').cloneNode(true);
  const html=clone.innerHTML;
  const btn=document.querySelector('.btn-success');
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  const payload={action:'saveAula',html,titulo,materia,turma_id,status,professor_email:user.email};
  if(aulaAtual&&aulaAtual.id){payload.id=aulaAtual.id;payload.file_id=aulaAtual.file_id;}
  const data=await post(payload);
  if(btn){btn.disabled=false;btn.textContent='🚀 Publicar';}
  if(data.error){toast('Erro: '+data.error);return;}
  toast(status==='publicada'?'✅ Aula publicada!':'💾 Rascunho salvo!');
  if(!aulaAtual) aulaAtual={id:data.id,titulo,materia,turma_id};
  else aulaAtual.id=data.id;
  if(turmaAtiva) await loadTurmas();
}

// BUILDER ELEMENT POPUPS
// ═══════════════════════════════════════════════
const elTemplates={
  titulo:`<h2>📋 Inserir Título</h2><label>Título:</label><input type="text" id="elTitulo" placeholder="Título da seção"><label>URL de imagem de fundo (opcional):</label><input type="text" id="elTituloBg" placeholder="https://..."><div class="el-popup-actions"><button class="btn btn-primary" onclick="elInsert('titulo')">Inserir</button><button class="btn btn-outline" onclick="elClose()">Cancelar</button></div>`,
  subtitulo:`<h2>📝 Inserir Subtítulo</h2><label>Subtítulo:</label><input type="text" id="elSub" placeholder="Subtítulo"><div class="el-popup-actions"><button class="btn btn-primary" onclick="elInsert('subtitulo')">Inserir</button><button class="btn btn-outline" onclick="elClose()">Cancelar</button></div>`,
  texto:`<h2>✏️ Inserir Texto</h2><label>Parágrafo:</label><textarea id="elTexto" rows="6" placeholder="Digite o texto..."></textarea><div class="el-popup-actions"><button class="btn btn-primary" onclick="elInsert('texto')">Inserir</button><button class="btn btn-outline" onclick="elClose()">Cancelar</button></div>`,
  imagem:`<h2>🖼️ Inserir Imagem</h2><label>URL da imagem:</label><input type="text" id="elImg" placeholder="https://..."><div class="el-popup-actions"><button class="btn btn-primary" onclick="elInsert('imagem')">Inserir</button><button class="btn btn-outline" onclick="elClose()">Cancelar</button></div>`,
  video:`<h2>🎥 Inserir Vídeo YouTube</h2><label>Link do YouTube:</label><input type="text" id="elVid" placeholder="https://www.youtube.com/watch?v=..."><div class="el-popup-actions"><button class="btn btn-primary" onclick="elInsert('video')">Inserir</button><button class="btn btn-outline" onclick="elClose()">Cancelar</button></div>`,
  dica:`<h2>💡 Dica Destacada</h2><label>Dica:</label><textarea id="elDica" rows="4" placeholder="Texto da dica..."></textarea><div class="el-popup-actions"><button class="btn btn-primary" onclick="elInsert('dica')">Inserir</button><button class="btn btn-outline" onclick="elClose()">Cancelar</button></div>`,
  pergunta:`<h2>❓ Pergunta Direta</h2><label>Pergunta:</label><textarea id="elPerg" rows="3" placeholder="Digite a pergunta..."></textarea><div class="el-popup-actions"><button class="btn btn-primary" onclick="elInsert('pergunta')">Inserir</button><button class="btn btn-outline" onclick="elClose()">Cancelar</button></div>`,
  quiz:`<h2>📊 Quiz de Múltipla Escolha</h2><label>Enunciado (opcional):</label><input type="text" id="qEnunciado" placeholder="Texto introdutório..."><label>URL de imagem (opcional):</label><input type="text" id="qImg" placeholder="https://..."><label>Pergunta:</label><input type="text" id="qPerg" placeholder="Digite a pergunta"><div class="two-cols"><div><label>Opção A:</label><input type="text" id="qA" placeholder="Opção A"></div><div><label>Opção B:</label><input type="text" id="qB" placeholder="Opção B"></div><div><label>Opção C:</label><input type="text" id="qC" placeholder="Opção C"></div><div><label>Opção D:</label><input type="text" id="qD" placeholder="Opção D"></div></div><label>Resposta correta:</label><select id="qCorreta"><option value="1">A</option><option value="2">B</option><option value="3">C</option><option value="4">D</option></select><div class="el-popup-actions"><button class="btn btn-primary" onclick="elInsert('quiz')">Inserir Quiz</button><button class="btn btn-outline" onclick="elClose()">Cancelar</button></div>`,
  embed:`<h2>🔗 Embed HTML</h2><label>Código HTML:</label><textarea id="elEmbed" rows="6" placeholder="<iframe ...></iframe>"></textarea><div class="el-popup-actions"><button class="btn btn-primary" onclick="elInsert('embed')">Inserir</button><button class="btn btn-outline" onclick="elClose()">Cancelar</button></div>`
};

function elOpen(type){document.getElementById('elPopupBox').innerHTML=elTemplates[type]||'';document.getElementById('elOverlay').classList.add('open');}
function elClose(){document.getElementById('elOverlay').classList.remove('open');}
document.getElementById('elOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('elOverlay'))elClose();});

function esc(text){if(!text)return'';return String(text).replace(/[&<>"']/g,t=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[t]||t));}
function escJ(s){return String(s||'').replace(/'/g,"\\'").replace(/"/g,'\\"');}
function escAttr(s){return String(s||'').replace(/"/g,'&quot;');}
function viz(){return document.getElementById('visualizacao');}

function elInsert(type){
  const v=viz();if(!v)return;
  let el;
  switch(type){
    case 'titulo':{const t=document.getElementById('elTitulo').value,bg=document.getElementById('elTituloBg').value;if(!t){toast('Digite o título');return;}el=document.createElement('h1');el.textContent=t;if(bg)el.style.background=`url('${bg}') center/cover no-repeat`;break;}
    case 'subtitulo':{const t=document.getElementById('elSub').value;if(!t){toast('Digite o subtítulo');return;}el=document.createElement('h2');el.textContent=t;break;}
    case 'texto':{const t=document.getElementById('elTexto').value;if(!t){toast('Digite o texto');return;}el=document.createElement('p');el.textContent=t;break;}
    case 'imagem':{const u=document.getElementById('elImg').value;if(!u){toast('Digite a URL');return;}el=document.createElement('img');el.src=u;el.className='media-element';break;}
    case 'video':{const u=document.getElementById('elVid').value;if(!u){toast('Digite a URL');return;}el=document.createElement('div');el.className='video-container';const iframe=document.createElement('iframe');let src=u;if(u.includes('watch?v='))src=u.replace('watch?v=','embed/');if(u.includes('youtu.be/'))src=u.replace('youtu.be/','www.youtube.com/embed/');iframe.src=src;iframe.allowFullscreen=true;el.appendChild(iframe);break;}
    case 'dica':{const t=document.getElementById('elDica').value;if(!t){toast('Digite a dica');return;}el=document.createElement('div');el.className='dica-destacada';el.textContent=t;break;}
    case 'pergunta':{const q=document.getElementById('elPerg').value;if(!q){toast('Digite a pergunta');return;}const chave='resposta_'+btoa(q+'_'+Date.now());el=document.createElement('div');el.innerHTML=`<div class="pergunta-direta">${esc(q)}</div><textarea class="papel-resposta" data-chave="${chave}" placeholder="Digite sua resposta aqui..."></textarea>`;const ta=el.querySelector('textarea');ta.addEventListener('input',()=>localStorage.setItem(chave,ta.value));break;}
    case 'quiz':{const qid='quiz_'+Date.now();const enunc=document.getElementById('qEnunciado').value;const imgU=document.getElementById('qImg').value;const perg=document.getElementById('qPerg').value;const opts=[document.getElementById('qA').value||'Opção A',document.getElementById('qB').value||'Opção B',document.getElementById('qC').value||'Opção C',document.getElementById('qD').value||'Opção D'];const correta=document.getElementById('qCorreta').value;if(!perg){toast('Digite a pergunta');return;}const name=qid+'_name';const letters=['A','B','C','D'];el=document.createElement('div');el.className='quiz-card';el.setAttribute('data-quiz-id',qid);el.innerHTML=`<div class="quiz-header">📊 Questão de Múltipla Escolha</div>${enunc?`<div class="quiz-enunciado">${esc(enunc)}</div>`:''}${imgU?`<img class="quiz-image" src="${esc(imgU)}" alt="Imagem">`:''}<div class="quiz-pergunta">${esc(perg)}</div><div class="quiz-options">${opts.map((o,i)=>`<label class="option-label"><input class="option-input" type="radio" name="${name}" value="${i+1}" ${Number(correta)===i+1?'data-correct="true"':''}><span><strong>${letters[i]})</strong> ${esc(o)}</span></label>`).join('')}</div><div class="quiz-actions"><button class="btn" onclick="verificarQuiz(this)" data-quiz-id="${qid}">Verificar Resposta</button><div class="quiz-result" data-result-for="${qid}"></div></div>`;break;}
    case 'embed':{const h=document.getElementById('elEmbed').value;if(!h){toast('Digite o HTML');return;}el=document.createElement('div');el.innerHTML=h;break;}
  }
  if(el)v.appendChild(el);
  elClose();
}

function verificarQuiz(btn){
  const qid=btn.getAttribute('data-quiz-id');
  const container=btn.closest('.quiz-card');if(!container)return;
  const resultBox=container.querySelector(`.quiz-result[data-result-for="${qid}"]`);
  container.querySelectorAll('.option-label').forEach(l=>l.classList.remove('correct','incorrect'));
  const correctR=Array.from(container.querySelectorAll('input[type=radio]')).find(r=>r.hasAttribute('data-correct'));
  const selected=container.querySelector('input[type=radio]:checked');
  if(!selected){if(resultBox){resultBox.textContent='⚠️ Escolha uma opção';resultBox.style.color='#d97706';}return;}
  if(correctR)correctR.closest('.option-label')?.classList.add('correct');
  const selLabel=selected.closest('.option-label');
  if(selLabel&&!selected.hasAttribute('data-correct'))selLabel.classList.add('incorrect');
  if(resultBox){const ok=selected.hasAttribute('data-correct');resultBox.textContent=ok?'✅ Correto!':'❌ Incorreto';resultBox.style.color=ok?'#059669':'#dc2626';}
}
window.verificarQuiz=verificarQuiz;
