<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAVA · Professor</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --p1:#4f46e5;--p2:#7c3aed;--grad:linear-gradient(135deg,var(--p1),var(--p2));
  --dark:#1e1b4b;--dark2:#2d2a6e;--sidebar-w:240px;
  --text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--bg:#f5f3ff;--white:#fff;
  --green:#059669;--red:#dc2626;--amber:#d97706;
  --radius:12px;--card-shadow:0 1px 4px rgba(79,70,229,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Lato',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;}

/* ── Sidebar ── */
.sidebar{width:var(--sidebar-w);background:var(--dark);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.07);}
.sidebar-logo-row{display:flex;align-items:center;gap:10px;}
.logo-icon-box{width:30px;height:30px;background:var(--p1);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-icon-box i{color:#fff;font-size:16px;}
.sidebar-logo h1{font-family:'Outfit',sans-serif;font-size:17px;font-weight:700;color:#fff;}
.sidebar-logo span{font-size:11px;color:rgba(255,255,255,.4);font-weight:400;display:block;margin-top:2px;}
.user-card{margin:12px 10px 8px;background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--p1);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;}
.user-card .uname{font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;color:#fff;}
.user-card .urole{font-size:11px;color:rgba(255,255,255,.45);margin-top:1px;}
.sidebar-section{padding:14px 14px 4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.25);letter-spacing:1.5px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:all .15s;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--p1);color:#fff;font-weight:600;}
.nav-item i{font-size:16px;width:18px;text-align:center;flex-shrink:0;}
.nav-turma-item{padding:7px 14px 7px 42px;font-size:12px;color:rgba(255,255,255,.45);cursor:pointer;transition:all .15s;}
.nav-turma-item:hover{color:#fff;background:rgba(255,255,255,.04);}
.nav-turma-item.active{color:#a5b4fc;font-weight:600;}
.sidebar-bottom{margin-top:auto;padding:12px;}
.btn-logout{width:100%;padding:9px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-logout:hover{background:rgba(220,38,38,.25);color:#fff;}
.btn-logout i{font-size:14px;}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:var(--white);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.topbar h2{font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;color:var(--dark);}
.topbar-actions{display:flex;gap:8px;}
.content{flex:1;overflow-y:auto;padding:22px;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;font-family:'Outfit',sans-serif;}
.btn i{font-size:15px;}
.btn-primary{background:var(--p1);color:#fff;}
.btn-primary:hover{background:#4338ca;box-shadow:0 4px 12px rgba(79,70,229,.25);}
.btn-sm{padding:6px 13px;font-size:12px;}
.btn-outline{background:transparent;border:1.5px solid var(--p1);color:var(--p1);}
.btn-outline:hover{background:var(--p1);color:#fff;}
.btn-danger{background:transparent;border:1.5px solid var(--red);color:var(--red);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-ghost{background:rgba(79,70,229,.07);color:var(--p1);}
.btn-ghost:hover{background:rgba(79,70,229,.14);}
.btn-success{background:var(--green);color:#fff;}
.btn-success:hover{background:#047857;}

/* ── Cards ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{background:var(--white);border-radius:var(--radius);padding:18px;box-shadow:var(--card-shadow);border:1px solid var(--border);display:flex;align-items:center;gap:14px;}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.stat-icon i{font-size:20px;}
.stat-icon.blue{background:#eef2ff;color:var(--p1);}
.stat-icon.green{background:#f0fdf4;color:var(--green);}
.stat-icon.amber{background:#fffbeb;color:var(--amber);}
.stat-icon.purple{background:#faf5ff;color:var(--p2);}
.stat-info .num{font-family:'Outfit',sans-serif;font-size:26px;font-weight:800;color:var(--dark);}
.stat-info .lbl{font-size:12px;color:var(--muted);margin-top:2px;}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-header h3{font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;color:var(--dark);}

/* ── List cards ── */
.list-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--card-shadow);border:1px solid var(--border);overflow:hidden;margin-bottom:14px;}
.list-card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.list-card-header h3{font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;}
.list-item{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;transition:background .12s;}
.list-item:last-child{border-bottom:none;}
.list-item:hover{background:#fafafa;}
.list-item-icon{width:36px;height:36px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.list-item-icon i{font-size:17px;color:var(--p1);}
.list-item-info{flex:1;min-width:0;}
.list-item-info .title{font-weight:700;font-size:14px;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-item-info .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.list-item-actions{display:flex;gap:6px;flex-shrink:0;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:#dcfce7;color:var(--green);}
.badge-amber{background:#fef3c7;color:var(--amber);}
.badge-gray{background:#f3f4f6;color:var(--muted);}
.badge-blue{background:#eef2ff;color:var(--p1);}

/* ── Turma card ── */
.turma-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--card-shadow);border:1px solid var(--border);padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:all .15s;}
.turma-card:hover{border-color:var(--p1);box-shadow:0 4px 16px rgba(79,70,229,.12);}
.turma-card h3{font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;}
.turma-card .turma-meta{display:flex;gap:12px;font-size:12px;color:var(--muted);}
.turma-card .turma-code{font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;color:var(--p1);background:#eef2ff;padding:3px 10px;border-radius:20px;letter-spacing:1px;}
.turma-progress{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:2px;}
.turma-progress-fill{height:100%;background:var(--p1);border-radius:2px;}

/* ── Form popup ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;backdrop-filter:blur(4px);align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.popup-box{background:var(--white);border-radius:16px;padding:28px;width:90%;max-width:520px;max-height:90vh;overflow-y:auto;animation:popIn .2s ease;}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.popup-box h2{font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;color:var(--dark);margin-bottom:20px;}
.form-field{margin-bottom:14px;}
.form-field label{display:block;font-weight:700;font-size:12px;color:var(--text);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.form-field input,.form-field select,.form-field textarea{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:'Lato',sans-serif;color:var(--text);outline:none;transition:border-color .15s;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--p1);}
.popup-actions{display:flex;gap:8px;margin-top:18px;}
.popup-actions .btn{flex:1;justify-content:center;}

/* ── Builder ── */
#builderPanel{display:none;flex-direction:column;height:100%;}
#builderPanel.active{display:flex;}
.builder-toolbar{background:var(--white);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.builder-meta{padding:12px 18px;background:var(--white);border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;}
.builder-meta input,.builder-meta select{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;}
.builder-meta input:focus,.builder-meta select:focus{border-color:var(--p1);}
.builder-canvas{flex:1;overflow-y:auto;padding:28px;background:var(--bg);}
.builder-editor{background:var(--white);border-radius:var(--radius);padding:36px;min-height:500px;box-shadow:var(--card-shadow);border:1px solid var(--border);}
#visualizacao{font-family:'Georgia',serif;font-size:18px;line-height:1.8;color:#333;min-height:200px;outline:none;}
#visualizacao:empty::before{content:'Clique aqui e use os botões acima para adicionar conteúdo...';color:#ccc;font-style:italic;}
#visualizacao h1{text-align:center;color:#fff;font-size:34px;font-weight:bold;display:flex;align-items:center;justify-content:center;min-height:160px;padding:28px;background:var(--grad);border-radius:10px;margin:0 0 28px;text-shadow:2px 2px 8px rgba(0,0,0,.25);}
#visualizacao h2{color:var(--p1);font-size:26px;margin:28px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--p1);}
#visualizacao h2+p:first-letter{float:left;font-size:3.6em;line-height:.9;padding-right:10px;font-weight:bold;color:var(--p1);}
#visualizacao p{margin:14px 0;text-align:justify;}
#visualizacao img.media-element{margin:18px 0;max-width:100%;border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.08);}
#visualizacao .video-container{position:relative;padding-bottom:56.25%;height:0;margin:18px 0;border-radius:8px;overflow:hidden;}
#visualizacao .video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;}
#visualizacao .dica-destacada{background:#eef2ff;padding:22px;border-radius:10px;border-left:4px solid var(--p1);font-weight:500;margin:22px 0;}
#visualizacao .dica-destacada::before{content:"💡 Dica: ";font-weight:bold;color:var(--p1);}
#visualizacao .pergunta-direta{margin:22px 0;padding:18px;background:#f5f3ff;border-left:4px solid var(--p2);border-radius:10px;font-weight:600;color:var(--p2);}
#visualizacao .papel-resposta{display:block;width:100%;min-height:140px;padding:14px;font-family:'Georgia',serif;font-size:16px;line-height:30px;border:1.5px solid var(--border);border-radius:8px;outline:none;background:#fff;resize:vertical;margin:12px 0;transition:border-color .15s;}
#visualizacao .papel-resposta:focus{border-color:var(--p1);}
#visualizacao .quiz-card{margin:22px 0;padding:22px;border-radius:10px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1.5px solid var(--border);}
#visualizacao .quiz-header{font-weight:bold;margin-bottom:10px;color:var(--p1);font-size:13px;text-transform:uppercase;letter-spacing:.4px;}
#visualizacao .quiz-pergunta{font-size:17px;font-weight:600;color:#333;margin-bottom:14px;}
#visualizacao .quiz-enunciado{font-size:15px;color:#555;font-style:italic;margin-bottom:8px;}
#visualizacao .quiz-image{max-width:100%;border-radius:8px;margin:8px 0;}
#visualizacao .option-label{display:block;margin:8px 0;padding:12px;border-radius:8px;border:1.5px solid var(--border);cursor:pointer;transition:all .15s;background:#fff;}
#visualizacao .option-label:hover{border-color:var(--p1);background:#eef2ff;}
#visualizacao .option-label.correct{background:#dcfce7;border-color:var(--green);}
#visualizacao .option-label.incorrect{background:#fee2e2;border-color:var(--red);}
#visualizacao .quiz-actions{margin-top:14px;display:flex;gap:10px;align-items:center;}
#visualizacao .quiz-result{font-weight:700;font-size:14px;}
#visualizacao .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;background:var(--grad);color:#fff;}

.builder-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text);transition:all .15s;white-space:nowrap;}
.builder-btn:hover{border-color:var(--p1);color:var(--p1);background:#eef2ff;}
.builder-btn i{font-size:15px;}

/* ── Grades table ── */
.grades-table{width:100%;border-collapse:collapse;font-size:13px;}
.grades-table th{background:var(--dark);color:rgba(255,255,255,.75);padding:10px 14px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.grades-table td{padding:10px 14px;border-bottom:1px solid var(--border);}
.grades-table tr:hover td{background:#fafafa;}
.grade-input{width:68px;padding:5px 9px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;text-align:center;outline:none;}
.grade-input:focus{border-color:var(--p1);}

/* ── Aluno list ── */
.aluno-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);}
.aluno-avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0;}

/* ── States ── */
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state .es-icon{font-size:48px;margin-bottom:14px;}
.empty-state h3{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px;}
.hidden{display:none!important;}
.loading{text-align:center;padding:36px;color:var(--muted);}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;animation:toastIn .25s ease;pointer-events:none;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

/* ── Element popups ── */
.el-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;backdrop-filter:blur(4px);}
.el-overlay.open{display:flex;align-items:center;justify-content:center;}
.el-popup{background:#fff;border-radius:14px;padding:24px;width:90%;max-width:540px;max-height:85vh;overflow-y:auto;}
.el-popup h2{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;margin-bottom:18px;}
.el-popup label{display:block;font-weight:700;font-size:11px;margin-bottom:5px;margin-top:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
.el-popup input[type=text],.el-popup textarea,.el-popup select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;}
.el-popup input[type=text]:focus,.el-popup textarea:focus{border-color:var(--p1);}
.el-popup-actions{display:flex;gap:8px;margin-top:18px;}
.el-popup-actions .btn{flex:1;justify-content:center;}
.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ── Correção ── */
.corr-select{padding:5px 9px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-weight:600;outline:none;cursor:pointer;transition:border-color .15s;background:#fff;}
.corr-select:focus{border-color:var(--p1);}
.corr-select.correto{border-color:var(--green);background:#f0fdf4;color:var(--green);}
.corr-select.parcial{border-color:var(--amber);background:#fffbeb;color:var(--amber);}
.corr-select.incorreto{border-color:var(--red);background:#fef2f2;color:var(--red);}
.nota-auto{background:#eef2ff;color:var(--p1);font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;margin-left:4px;}
.nota-manual{background:#f0fdf4;color:var(--green);font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;margin-left:4px;}
.calc-bar{background:var(--dark);border-radius:10px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:10px;}
.calc-bar p{color:rgba(255,255,255,.75);font-size:12px;flex:1;}

/* ── Hamburger ── */
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:7px;border:none;background:transparent;flex-shrink:0;}
.hamburger span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px;transition:all .25s;}
.hamburger.active span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hamburger.active span:nth-child(2){opacity:0;}
.hamburger.active span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:499;backdrop-filter:blur(2px);}
.sidebar-backdrop.open{display:block;}

@media(max-width:900px){
  .hamburger{display:flex;}
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:500;transition:left .25s ease;}
  .sidebar.open{left:0;box-shadow:8px 0 28px rgba(0,0,0,.22);}
  .main{width:100%;}
  .content{padding:14px;}
  .cards-grid{grid-template-columns:1fr 1fr;}
  .builder-meta{flex-wrap:wrap;gap:8px;padding:8px 12px;}
  .builder-meta span{display:none;}
  .builder-meta input,.builder-meta select{width:100%!important;flex:1 1 100%;}
  .builder-toolbar{gap:5px;padding:7px 10px;overflow-x:auto;flex-wrap:nowrap;}
  .builder-btn{font-size:11px;padding:6px 9px;flex-shrink:0;}
  .builder-canvas{padding:10px;}
  .builder-editor{padding:18px;}
  .list-item{flex-wrap:wrap;gap:6px;}
  .list-item-actions{width:100%;display:flex;justify-content:flex-end;}
  .topbar{padding:0 14px;}
  .topbar h2{font-size:15px;}
  .grades-table th,.grades-table td{padding:7px 9px;font-size:12px;}
}
@media(max-width:480px){
  .cards-grid{grid-template-columns:1fr;}
  .popup-box{padding:18px 14px;}
  .list-item-actions .btn{font-size:11px;padding:5px 7px;}
  .builder-btn i{display:none;}
}
</style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-row">
      <div class="logo-icon-box"><i class="ti ti-school"></i></div>
      <div>
        <h1>EduAVA</h1>
        <span>Painel do Professor</span>
      </div>
    </div>
  </div>
  <div class="user-card">
    <div class="user-avatar" id="sidebarAvatar">?</div>
    <div>
      <div class="uname" id="sidebarNome">Carregando...</div>
      <div class="urole">Professor(a)</div>
    </div>
  </div>
  <div class="sidebar-section">Menu</div>
  <div class="nav-item active" onclick="showSection('dashboard')" id="nav-dashboard">
    <i class="ti ti-layout-dashboard"></i> Dashboard
  </div>
  <div class="nav-item" onclick="showSection('turmas')" id="nav-turmas">
    <i class="ti ti-school"></i> Minhas Turmas
  </div>
  <div class="sidebar-section" id="turmasNavSection" style="display:none">Turmas</div>
  <div id="turmasNavList"></div>
  <div class="sidebar-section">Aula</div>
  <div class="nav-item" onclick="showSection('builder')" id="nav-builder">
    <i class="ti ti-pencil"></i> Criar / Editar Aula
  </div>
  <div class="sidebar-bottom">
    <button class="btn-logout" onclick="logout()"><i class="ti ti-logout"></i> Sair</button>
  </div>
</nav>

<script>
// ═══════════════════════════════════════════════
// CONFIG & STATE
// ═══════════════════════════════════════════════
let API = localStorage.getItem('ava_api') || '';
let user = JSON.parse(localStorage.getItem('ava_user') || 'null');
let turmas = [];
let aulaAtual = null;
let turmaAtiva = null;
let aulas = [];
let _pendingTurmaId = null;

async function post(payload) {
  const r = await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
  return r.json();
}
async function get(params) {
  const qs = new URLSearchParams(params).toString();
  const r  = await fetch(API+'?'+qs);
  return r.json();
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

// ═══════════════════════════════════════════════
// SIDEBAR MOBILE
// ═══════════════════════════════════════════════
function toggleSidebar() {
  const sb  = document.getElementById('sidebar');
  const btn = document.getElementById('hamburgerBtn');
  const bk  = document.getElementById('sidebarBackdrop');
  sb.classList.toggle('open');
  btn.classList.toggle('active');
  bk.classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('hamburgerBtn').classList.remove('active');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
window.addEventListener('load', async () => {
  if (!user || user.tipo !== 'professor') { window.location.href='index.html'; return; }
  document.getElementById('sidebarNome').textContent = user.nome;
  document.getElementById('sidebarAvatar').textContent = user.nome[0].toUpperCase();
  await loadTurmas();
  showSection('dashboard');
});

function logout() {
  localStorage.removeItem('ava_user');
  window.location.href = 'index.html';
}

function setActive(id) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const el = document.getElementById('nav-'+id);
  if (el) el.classList.add('active');
}

// ═══════════════════════════════════════════════
// TURMAS
// ═══════════════════════════════════════════════
async function loadTurmas() {
  const data = await post({ action:'getTurmas', email: user.email });
  turmas = data.turmas || [];
  renderTurmasNav();
}

function renderTurmasNav() {
  const list = document.getElementById('turmasNavList');
  const sec  = document.getElementById('turmasNavSection');
  if (turmas.length === 0) { list.innerHTML=''; sec.style.display='none'; return; }
  sec.style.display = 'block';
  list.innerHTML = turmas.map(t => `
    <div class="nav-turma-item" onclick="openTurma('${t.id}')" id="navt-${t.id}">${t.nome}</div>
  `).join('');
}

async function criarTurma() {
  const nome = document.getElementById('turmaNome').value.trim();
  if (!nome) { toast('Digite o nome da turma.'); return; }
  const data = await post({ action:'createTurma', nome, professor_email: user.email });
  if (data.error) { toast('Erro: '+data.error); return; }
  toast('✅ Turma criada! Código: '+data.codigo);
  document.getElementById('turmaNome').value = '';
  closeOverlay('overlayTurma');
  await loadTurmas();
  showSection('turmas');
}

async function deletarTurma(id) {
  if (!confirm('Excluir esta turma e todas as aulas? Essa ação não pode ser desfeita.')) return;
  await post({ action:'deleteTurma', id });
  toast('Turma excluída.');
  await loadTurmas();
  showSection('turmas');
}

function openTurma(id) {
  turmaAtiva = turmas.find(t => t.id === id);
  showSection('turmaDetail');
}

// ═══════════════════════════════════════════════
// SECTIONS
// ═══════════════════════════════════════════════
function showSection(section) {
  closeSidebar();
  const content = document.getElementById('mainContent');
  const title   = document.getElementById('pageTitle');
  const actions = document.getElementById('topbarActions');
  actions.innerHTML = '';
  document.querySelectorAll('.nav-turma-item').forEach(n=>n.classList.remove('active'));

  switch(section) {
    case 'dashboard':
      setActive('dashboard'); title.textContent = 'Dashboard';
      renderDashboard(); break;
    case 'turmas':
      setActive('turmas'); title.textContent = 'Minhas Turmas';
      actions.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openOverlay('overlayTurma')"><i class="ti ti-plus"></i> Nova Turma</button>`;
      renderTurmas(); break;
    case 'turmaDetail':
      if (!turmaAtiva) { showSection('turmas'); return; }
      const navEl = document.getElementById('navt-'+turmaAtiva.id);
      if (navEl) navEl.classList.add('active');
      title.textContent = turmaAtiva.nome;
      actions.innerHTML = `
        <button class="btn btn-ghost btn-sm" onclick="showNotasModal('${turmaAtiva.id}')"><i class="ti ti-chart-bar"></i> Notas</button>
        <button class="btn btn-danger btn-sm" onclick="deletarTurma('${turmaAtiva.id}')"><i class="ti ti-trash"></i> Excluir</button>
      `;
      renderTurmaDetail(); break;
    case 'builder':
      setActive('builder'); title.textContent = aulaAtual ? 'Editando: '+aulaAtual.titulo : 'Nova Aula';
      actions.innerHTML = `
        <button class="btn btn-ghost btn-sm" onclick="salvarRascunho()"><i class="ti ti-device-floppy"></i> Rascunho</button>
        <button class="btn btn-success btn-sm" onclick="publicarAula()"><i class="ti ti-rocket"></i> Publicar</button>
      `;
      renderBuilder(); break;
  }
}

// ═══════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════
function renderDashboard() {
  const totalAlunos = turmas.reduce((s,t) => s + (Number(t.alunos_count)||0), 0);
  document.getElementById('mainContent').innerHTML = `
    <div style="font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;color:var(--dark);margin-bottom:20px">
      Olá, ${user.nome.split(' ')[0]}! 👋
    </div>
    <div class="cards-grid">
      <div class="stat-card"><div class="stat-icon blue"><i class="ti ti-school"></i></div><div class="stat-info"><div class="num">${turmas.length}</div><div class="lbl">Turmas ativas</div></div></div>
      <div class="stat-card"><div class="stat-icon green"><i class="ti ti-users"></i></div><div class="stat-info"><div class="num">${totalAlunos}</div><div class="lbl">Alunos</div></div></div>
      <div class="stat-card"><div class="stat-icon amber"><i class="ti ti-file-text"></i></div><div class="stat-info"><div class="num" id="statAulas">—</div><div class="lbl">Aulas Publicadas</div></div></div>
    </div>
    <div class="section-header"><h3>Acesso Rápido</h3></div>
    <div class="cards-grid">
      <div class="turma-card" onclick="openOverlay('overlayTurma')" style="align-items:center;justify-content:center;min-height:100px;border-style:dashed">
        <div style="font-size:28px;margin-bottom:6px">+</div>
        <div style="font-weight:700;color:var(--muted);font-size:13px">Nova Turma</div>
      </div>
      <div class="turma-card" onclick="novaAula()" style="align-items:center;justify-content:center;min-height:100px;border-style:dashed">
        <i class="ti ti-pencil" style="font-size:28px;color:var(--muted);margin-bottom:6px"></i>
        <div style="font-weight:700;color:var(--muted);font-size:13px">Criar Aula</div>
      </div>
    </div>
    ${turmas.length ? `
    <div class="section-header"><h3>Suas Turmas</h3></div>
    <div class="cards-grid">
      ${turmas.map(t=>`
        <div class="turma-card" onclick="openTurma('${t.id}')">
          <h3>${t.nome}</h3>
          <div class="turma-meta"><span>👥 ${t.alunos_count||0} alunos</span></div>
          <div><span class="turma-code">${t.codigo}</span></div>
        </div>
      `).join('')}
    </div>` : ''}
  `;
}

// ═══════════════════════════════════════════════
// TURMAS LIST
// ═══════════════════════════════════════════════
function renderTurmas() {
  if (!turmas.length) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state"><div class="es-icon">🏫</div><h3>Nenhuma turma ainda</h3><p>Crie sua primeira turma para começar.</p></div>`;
    return;
  }
  document.getElementById('mainContent').innerHTML = `
    <div class="cards-grid">
      ${turmas.map(t=>`
        <div class="turma-card" onclick="openTurma('${t.id}')">
          <h3>${t.nome}</h3>
          <div class="turma-meta"><span>👥 ${t.alunos_count||0} alunos</span></div>
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span class="turma-code">🔑 ${t.codigo}</span>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

// ═══════════════════════════════════════════════
// TURMA DETAIL
// ═══════════════════════════════════════════════
async function renderTurmaDetail() {
  document.getElementById('mainContent').innerHTML = `<div class="loading">Carregando dados da turma...</div>`;
  const [aulaData, alunoData] = await Promise.all([
    post({ action:'getAulas', turma_id: turmaAtiva.id }),
    post({ action:'getAlunos', turma_id: turmaAtiva.id })
  ]);
  aulas = aulaData.aulas || [];
  const alunos = alunoData.alunos || [];

  document.getElementById('mainContent').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px">
      <div class="stat-card"><div class="stat-icon blue"><i class="ti ti-file-text"></i></div><div class="stat-info"><div class="num">${aulas.length}</div><div class="lbl">Aulas</div></div></div>
      <div class="stat-card"><div class="stat-icon green"><i class="ti ti-users"></i></div><div class="stat-info"><div class="num">${alunos.length}</div><div class="lbl">Alunos</div></div></div>
    </div>

    <div style="background:#eef2ff;border-radius:10px;padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:14px;border:1px solid #c7d2fe">

      ${aulas.length ? aulas.map(a=>`

      `).join('') : '<div class="empty-state" style="padding:28px"><div class="es-icon">📄</div><h3>Nenhuma aula</h3><p>Crie a primeira aula desta turma.</p></div>'}

    <div class="section-header" style="margin-top:22px"><h3>👥 Alunos</h3></div>
    <div class="list-card">
      ${alunos.length ? alunos.map(a=>`
        <div class="aluno-row">

// ═══════════════════════════════════════════════
// NOTAS
// ═══════════════════════════════════════════════
async function showNotasModal(turma_id) {
  openOverlay('overlayNotas');
  document.getElementById('notasContent').innerHTML = '<div class="loading">Carregando...</div>';
  const [alunoData, aulaData, notaData] = await Promise.all([
    post({ action:'getAlunos', turma_id }),
    post({ action:'getAulas',  turma_id }),
    post({ action:'getNotas',  turma_id })
  ]);
  const alunos = alunoData.alunos||[];
  const aulasL = aulaData.aulas||[];
  const notas  = notaData.notas||[];

  if (!alunos.length || !aulasL.length) {
    document.getElementById('notasContent').innerHTML = '<p style="color:var(--muted)">Sem alunos ou aulas para lançar notas.</p>';
    return;
  }

  function getNotaObj(email, aula_id) {
    return notas.find(n => n.aluno_email.toLowerCase()===email.toLowerCase() && n.aula_id===aula_id);
  }

  document.getElementById('notasContent').innerHTML = `
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px">
      Notas com <span class="nota-auto">AUTO</span> foram calculadas automaticamente.
      Você pode ajustá-las manualmente (0–10).
    </p>
    <div style="overflow-x:auto">
    <table class="grades-table">
      <tr>
        <th>Aluno</th>
        ${aulasL.map(a=>`<th>${a.titulo}</th>`).join('')}
      </tr>
      ${alunos.map(al=>`
        <tr>
          <td style="font-weight:700">${esc(al.nome)}</td>
          ${aulasL.map(a => {
            const obj = getNotaObj(al.email, a.id);
            const val = obj ? obj.nota : '';
            const tag = obj?.comentario === '__auto__'
              ? `<span class="nota-auto">AUTO</span>`
              : (obj ? `<span class="nota-manual">MANUAL</span>` : '');
            return `<td style="min-width:110px">
              <div style="display:flex;align-items:center;gap:5px">
                <input class="grade-input" type="number" min="0" max="10" step="0.1"
                  value="${val}"
                  onblur="salvarNotaManual('${al.email}','${a.id}','${turma_id}',this.value,this)">
                ${tag}
              </div>
            </td>`;
          }).join('')}
        </tr>
      `).join('')}
    </table>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-top:10px">
      Edite e saia do campo para salvar manualmente. Para calcular automaticamente use o botão 
      <strong>👁 Respostas</strong> em cada aula.
    </p>
  `;
}

async function salvarNotaManual(email, aula_id, turma_id, valor, inputEl) {
  if (valor === '') return;
  await post({ action:'saveNota', aluno_email:email, aula_id, turma_id, nota:Number(valor).toFixed(1), comentario:'' });
  const badge = inputEl?.parentElement?.querySelector('.nota-auto,.nota-manual');
  if (badge) { badge.className='nota-manual'; badge.textContent='MANUAL'; }
  toast('Nota salva!');
}

async function calcularNotasAuto(aula_id) {
  const btn = document.getElementById('btnCalcAuto_'+aula_id);
  if (btn) { btn.disabled=true; btn.textContent='Calculando...'; }

  const [alunoData, aulaData] = await Promise.all([
    post({ action:'getAlunos', turma_id: turmaAtiva.id }),
    post({ action:'getAula',   id: aula_id })
  ]);
  const alunos   = alunoData.alunos || [];
  const aulaHtml = aulaData.aula?.html || '';

  const parser = new DOMParser();
  const doc    = parser.parseFromString(aulaHtml, 'text/html');

  const perguntas = Array.from(doc.querySelectorAll('.pergunta-direta')).map(el => ({
    texto: el.textContent.trim(),
    chave: el.nextElementSibling?.getAttribute('data-chave') || ''
  })).filter(p => p.chave);

  const quizzes = Array.from(doc.querySelectorAll('.quiz-card')).map(el => ({
    id:     el.getAttribute('data-quiz-id') || '',
    chave:  'quiz_answer_' + (el.getAttribute('data-quiz-id') || ''),
    corretaIdx: Array.from(el.querySelectorAll('input[type=radio]')).findIndex(r => r.hasAttribute('data-correct'))
  })).filter(q => q.id);

  const totalItens = perguntas.length + quizzes.length;
  if (totalItens === 0) { toast('Esta aula não tem atividades para calcular nota.'); return; }

  const respostasMap = {};
  await Promise.all(alunos.map(async al => {
    const r = await post({ action:'getRespostas', aluno_email: al.email, aula_id });
    respostasMap[al.email] = r.respostas || [];
  }));

  let salvos = 0;
  for (const al of alunos) {
    const resps = respostasMap[al.email] || [];
    let pontos = 0;
    quizzes.forEach(q => {
      const r = resps.find(r => r.chave === q.chave);
      if (r && Number(r.valor) - 1 === q.corretaIdx) pontos += 1;
    });
    perguntas.forEach(p => {
      const corrChave = 'corr_' + p.chave;
      const r = resps.find(r => r.chave === corrChave);
      if (r?.valor === 'correto')    pontos += 1;
      else if (r?.valor === 'parcial') pontos += 0.5;
    });
    const pct  = (pontos / totalItens) * 10;
    const nota = Math.round(pct * 10) / 10;
    await post({ action:'saveNota', aluno_email: al.email, aula_id, turma_id: turmaAtiva.id,
      nota, comentario: '__auto__' });
    salvos++;
  }

  if (btn) { btn.disabled=false; btn.textContent='🔄 Recalcular'; }
  toast(`✅ Notas calculadas para ${salvos} aluno(s)!`);
}

async function salvarCorrecao(selectEl, aluno_email, aula_id, corrChave) {
  const valor = selectEl.value;
  selectEl.className = 'corr-select ' + (valor==='correto'?'correto': valor==='parcial'?'parcial':'incorreto');
  await post({ action:'saveResposta', aluno_email, aula_id, chave: corrChave, valor });
  toast('Correção salva!');
}

async function verRespostas(aula_id, titulo) {
  document.getElementById('overlayRespostasTitle').textContent = '📋 Respostas — ' + titulo;
  document.getElementById('respostasContent').innerHTML = '<div class="loading">Carregando respostas...</div>';
  openOverlay('overlayRespostas');

  const [alunoData, aulaData] = await Promise.all([
    post({ action:'getAlunos', turma_id: turmaAtiva.id }),
    post({ action:'getAula',   id: aula_id })
  ]);
  const alunos   = alunoData.alunos || [];
  const aulaHtml = aulaData.aula?.html || '';

  if (!alunos.length) {
    document.getElementById('respostasContent').innerHTML = '<p style="color:var(--muted)">Nenhum aluno matriculado nesta turma.</p>';
    return;
  }

  const parser    = new DOMParser();
  const doc       = parser.parseFromString(aulaHtml, 'text/html');

  const perguntas = Array.from(doc.querySelectorAll('.pergunta-direta')).map(el => ({
    texto: el.textContent.trim(),
    chave: el.nextElementSibling?.getAttribute('data-chave') || ''
  })).filter(p => p.chave);

  const quizzes = Array.from(doc.querySelectorAll('.quiz-card')).map(el => ({
    id:      el.getAttribute('data-quiz-id') || '',
    pergunta: el.querySelector('.quiz-pergunta')?.textContent.trim() || 'Quiz',
    opcoes:  Array.from(el.querySelectorAll('.option-label')).map(o => ({
      texto:  o.querySelector('span')?.textContent.trim() || '',
      correta: !!o.querySelector('[data-correct]')
    }))
  })).filter(q => q.id);

  if (!perguntas.length && !quizzes.length) {
    document.getElementById('respostasContent').innerHTML = '<p style="color:var(--muted)">Esta aula não possui atividades.</p>';
    return;
  }

  const respostasMap = {};
  await Promise.all(alunos.map(async al => {
    const r = await post({ action:'getRespostas', aluno_email: al.email, aula_id });
    respostasMap[al.email] = r.respostas || [];
  }));

  let html = '';
  const totalItens = perguntas.length + quizzes.length;

  if (perguntas.length) {
    html += `<h3 style="font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;color:var(--dark);margin:0 0 12px">
      ✏️ Respostas Dissertativas
      <span style="font-size:11px;font-weight:400;color:var(--muted);margin-left:6px">Corrija cada resposta individualmente</span>
    </h3>`;

    perguntas.forEach(perg => {
      html += `<div style="background:var(--bg);border-radius:10px;padding:16px;margin-bottom:14px;border-left:3px solid var(--p2)">
        <div style="font-weight:700;color:var(--p2);margin-bottom:10px;font-size:14px">${esc(perg.texto)}</div>`;

      alunos.forEach(al => {
        const resps    = respostasMap[al.email] || [];
        const resp     = resps.find(r => r.chave === perg.chave);
        const valor    = resp?.valor?.trim();
        const corrChave = 'corr_' + perg.chave;
        const corrResp  = resps.find(r => r.chave === corrChave);
        const corrVal   = corrResp?.valor || '';
        const corrClass = corrVal==='correto'?'correto': corrVal==='parcial'?'parcial': corrVal==='incorreto'?'incorreto':'';
        const corrLabel = {correto:'✅ Correto', parcial:'⚠️ Parcialmente Correto', incorreto:'❌ Incorreto','':'— Não corrigido'};

        html += `<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="width:32px;height:32px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0">${al.nome[0].toUpperCase()}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:12px;color:var(--dark);margin-bottom:4px">${esc(al.nome)}</div>
            <div style="font-size:13px;color:${valor?'var(--text)':'var(--muted)'};line-height:1.6;white-space:pre-wrap;background:${valor?'#fff':'transparent'};padding:${valor?'9px 11px':'0'};border-radius:7px;border:${valor?'1px solid var(--border)':'none'};margin-bottom:6px">${valor ? esc(valor) : '— Sem resposta'}</div>
            ${valor ? `
            <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
              <span style="font-size:11px;font-weight:700;color:var(--muted)">Correção:</span>
              <select class="corr-select ${corrClass}"
                onchange="salvarCorrecao(this,'${al.email}','${aula_id}','${corrChave}')">
                <option value="" ${corrVal===''?'selected':''}>— Selecione</option>
                <option value="correto"   ${corrVal==='correto'?'selected':''}>✅ Correto (100%)</option>
                <option value="parcial"   ${corrVal==='parcial'?'selected':''}>⚠️ Parcialmente Correto (50%)</option>
                <option value="incorreto" ${corrVal==='incorreto'?'selected':''}>❌ Incorreto (0%)</option>
              </select>
              ${corrVal ? `<span style="font-size:11px;color:var(--muted)">${corrLabel[corrVal]}</span>` : ''}
            </div>` : `<span style="font-size:11px;color:var(--muted);font-style:italic">Aluno ainda não respondeu</span>`}
          </div>
        </div>`;
      });

      html += `</div>`;
    });
  }

  if (quizzes.length) {
    html += `<h3 style="font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;color:var(--dark);margin:18px 0 12px">
      📊 Quizzes
      <span style="font-size:11px;font-weight:400;color:var(--muted);margin-left:6px">Correção automática</span>
    </h3>`;

    quizzes.forEach(quiz => {
      const respostas = alunos.map(al => {
        const r   = (respostasMap[al.email]||[]).find(r => r.chave === 'quiz_answer_'+quiz.id);
        const idx = r ? Number(r.valor) - 1 : -1;
        return { al, idx, opcao: quiz.opcoes[idx], acerto: quiz.opcoes[idx]?.correta };
      });
      const acertos = respostas.filter(r => r.acerto).length;
      const total   = respostas.filter(r => r.idx >= 0).length;
      const pct     = total > 0 ? Math.round((acertos/total)*100) : 0;

      html += `<div style="background:var(--bg);border-radius:10px;padding:16px;margin-bottom:14px;border-left:3px solid var(--p1)">
        <div style="font-weight:700;color:var(--p1);margin-bottom:4px;font-size:14px">${esc(quiz.pergunta)}</div>
        <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap">
          <span style="font-size:12px;color:var(--muted)">✅ ${acertos} acerto(s) de ${total} resposta(s)</span>
          <span style="font-size:12px;font-weight:700;color:${pct>=60?'var(--green)':pct>=40?'var(--amber)':'var(--red)'}">${pct}% de aproveitamento</span>
        </div>
        ${respostas.map(({al, idx, opcao, acerto}) => `
          <div style="display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)">
            <div style="width:30px;height:30px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;flex-shrink:0">${al.nome[0].toUpperCase()}</div>
            <div style="flex:1">
              <div style="font-weight:700;font-size:12px">${esc(al.nome)}</div>
              <div style="font-size:12px;color:var(--muted)">${opcao ? esc(opcao.texto) : '— Sem resposta'}</div>
            </div>
            <span style="font-size:16px">${idx < 0 ? '⬜' : acerto ? '✅' : '❌'}</span>
          </div>
        `).join('')}
      </div>`;
    });
  }

  html += `<div class="calc-bar">
    <p>Após corrigir as dissertativas, clique para calcular e salvar a nota de aproveitamento (0–10) de todos os alunos automaticamente.</p>
    <button id="btnCalcAuto_${aula_id}" class="btn btn-primary btn-sm" onclick="calcularNotasAuto('${aula_id}')">
      🧮 Calcular e Salvar Notas
    </button>
  </div>`;

  document.getElementById('respostasContent').innerHTML = html;
}

// AULAS
// ═══════════════════════════════════════════════
function novaAula(turma_id) {
  aulaAtual = null;
  _pendingTurmaId = turma_id || null;
  showSection('builder');
}

async function editarAula(id, file_id, titulo, materia, turma_id) {
  toast('Carregando aula...');
  const data = await post({ action:'getAula', id });
  if (data.error) { toast('Erro: '+data.error); return; }
  aulaAtual = { id, file_id, titulo, materia, turma_id };
  showSection('builder');
  document.getElementById('builderTitulo').value  = titulo;
  document.getElementById('builderMateria').value = materia;
  document.getElementById('builderTurmaId').value = turma_id;
  document.getElementById('visualizacao').innerHTML = data.aula.html || '';
  document.querySelectorAll('#visualizacao .quiz-card').forEach(c => {
    const saved = localStorage.getItem('quiz_answer_'+c.dataset.quizId);
    if (saved) { const r=c.querySelector(`input[value="${saved}"]`); if(r) r.checked=true; }
  });
}

async function deletarAula(id, file_id) {
  if (!confirm('Excluir esta aula?')) return;
  await post({ action:'deleteAula', id, file_id });
  toast('Aula excluída.');
  if (turmaAtiva) renderTurmaDetail();
}

async function salvarRascunho() { await saveAulaWithStatus('rascunho'); }
async function publicarAula()   { await saveAulaWithStatus('publicada'); }

async function saveAulaWithStatus(status) {
  const titulo   = document.getElementById('builderTitulo').value.trim();
  const materia  = document.getElementById('builderMateria').value.trim();
  const turma_id = document.getElementById('builderTurmaId').value;
  if (!titulo)   { toast('Digite o título da aula.'); return; }
  if (!turma_id) { toast('Selecione a turma.'); return; }

  const clone = document.getElementById('visualizacao').cloneNode(true);
  const html  = clone.innerHTML;

  const btn = document.querySelector('.btn-success');
  if (btn) { btn.disabled=true; btn.textContent='Salvando...'; }

  const payload = {
    action: 'saveAula', html, titulo, materia, turma_id,
    status, professor_email: user.email
  };
  if (aulaAtual && aulaAtual.id) {
    payload.id      = aulaAtual.id;
    payload.file_id = aulaAtual.file_id;
  }

  const data = await post(payload);
  if (btn) { btn.disabled=false; btn.innerHTML='<i class="ti ti-rocket"></i> Publicar'; }

  if (data.error) { toast('Erro: '+data.error); return; }
  toast(status==='publicada' ? '✅ Aula publicada!' : '💾 Rascunho salvo!');
  if (!aulaAtual) aulaAtual = { id: data.id, titulo, materia, turma_id };
  else aulaAtual.id = data.id;
  if (turmaAtiva) { await loadTurmas(); }
}

    <div class="el-popup-actions"><button class="btn btn-primary" onclick="elInsert('imagem')">Inserir</button><button class="btn btn-ghost" onclick="elClose()">Cancelar</button></div>`,
  video: `

    <div class="el-popup-actions"><button class="btn btn-primary" onclick="elInsert('video')">Inserir</button><button class="btn btn-ghost" onclick="elClose()">Cancelar</button></div>`,
  dica: `
    <h2>💡 Dica Destacada</h2>
    <label>Dica:</label><textarea id="elDica" rows="4" placeholder="Texto da dica..."></textarea>
    <div class="el-popup-actions"><button class="btn btn-primary" onclick="elInsert('dica')">Inserir</button><button class="btn btn-ghost" onclick="elClose()">Cancelar</button></div>`,
  pergunta: `
    <h2>❓ Pergunta Direta</h2>
    <label>Pergunta:</label><textarea id="elPerg" rows="3" placeholder="Digite a pergunta..."></textarea>
    <div class="el-popup-actions"><button class="btn btn-primary" onclick="elInsert('pergunta')">Inserir</button><button class="btn btn-ghost" onclick="elClose()">Cancelar</button></div>`,

    <h2>📊 Quiz de Múltipla Escolha</h2>

  embed: `

    <label>Código HTML:</label><textarea id="elEmbed" rows="6" placeholder="<iframe ...></iframe>"></textarea>

function elOpen(type) {
  document.getElementById('elPopupBox').innerHTML = elTemplates[type] || '';
  document.getElementById('elOverlay').classList.add('open');
}
function elClose() { document.getElementById('elOverlay').classList.remove('open'); }
document.getElementById('elOverlay').addEventListener('click', e => { if(e.target===document.getElementById('elOverlay')) elClose(); });

function esc(text) {
  if (!text) return '';
  return String(text).replace(/[&<>"']/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[t]||t));
}
function escJ(s) { return String(s||'').replace(/'/g,"\\'").replace(/"/g,'\\"'); }
function viz() { return document.getElementById('visualizacao'); }

function elInsert(type) {
  const v = viz(); if (!v) return;
  let el;
  switch(type) {
    case 'titulo': {
      const t=document.getElementById('elTitulo').value, bg=document.getElementById('elTituloBg').value;
      if(!t){toast('Digite o título');return;}
      el=document.createElement('h1'); el.textContent=t;
      if(bg) el.style.background=`url('${bg}') center/cover no-repeat`;
      break;
    }
    case 'subtitulo': {
      const t=document.getElementById('elSub').value; if(!t){toast('Digite o subtítulo');return;}
      el=document.createElement('h2'); el.textContent=t; break;
    }
    case 'texto': {
      const t=document.getElementById('elTexto').value; if(!t){toast('Digite o texto');return;}
      el=document.createElement('p'); el.textContent=t; break;
    }
    case 'imagem': {
      const u=document.getElementById('elImg').value; if(!u){toast('Digite a URL');return;}
      el=document.createElement('img'); el.src=u; el.className='media-element'; break;
    }
    case 'video': {
      const u=document.getElementById('elVid').value; if(!u){toast('Digite a URL');return;}
      el=document.createElement('div'); el.className='video-container';
      const iframe=document.createElement('iframe');
      let src=u;
      if(u.includes('watch?v=')) src=u.replace('watch?v=','embed/');
      if(u.includes('youtu.be/')) src=u.replace('youtu.be/','www.youtube.com/embed/');
      iframe.src=src; iframe.allowFullscreen=true; el.appendChild(iframe); break;
    }
    case 'dica': {
      const t=document.getElementById('elDica').value; if(!t){toast('Digite a dica');return;}
      el=document.createElement('div'); el.className='dica-destacada'; el.textContent=t; break;
    }
    case 'pergunta': {
      const q=document.getElementById('elPerg').value; if(!q){toast('Digite a pergunta');return;}
      const chave='resposta_'+btoa(q+'_'+Date.now());
      el=document.createElement('div');
      el.innerHTML=`<div class="pergunta-direta">${esc(q)}</div><textarea class="papel-resposta" data-chave="${chave}" placeholder="Digite sua resposta aqui..."></textarea>`;
      const ta=el.querySelector('textarea');
      ta.addEventListener('input',()=>localStorage.setItem(chave,ta.value));
      break;
    }
    case 'quiz': {
      const qid='quiz_'+Date.now();
      const enunc=document.getElementById('qEnunciado').value;
      const imgU=document.getElementById('qImg').value;
      const perg=document.getElementById('qPerg').value;
      const opts=[document.getElementById('qA').value||'Opção A',document.getElementById('qB').value||'Opção B',document.getElementById('qC').value||'Opção C',document.getElementById('qD').value||'Opção D'];
      const correta=document.getElementById('qCorreta').value;
      if(!perg){toast('Digite a pergunta');return;}
      const name=qid+'_name';
      const letters=['A','B','C','D'];
      el=document.createElement('div'); el.className='quiz-card'; el.setAttribute('data-quiz-id',qid);
      el.innerHTML=`
        <div class="quiz-header">📊 Questão de Múltipla Escolha</div>
        ${enunc?`<div class="quiz-enunciado">${esc(enunc)}</div>`:''}
        <div class="quiz-pergunta">${esc(perg)}</div>
        ${imgU?`<img class="quiz-image" src="${esc(imgU)}" alt="Imagem">`:''}
        <div class="quiz-options">
          ${opts.map((o,i)=>`<label class="option-label"><input class="option-input" type="radio" name="${name}" value="${i+1}" ${Number(correta)===i+1?'data-correct="true"':''}><span><strong>${letters[i]})</strong> ${esc(o)}</span></label>`).join('')}
        </div>
        <div class="quiz-actions">
          <button class="btn" onclick="verificarQuiz(this)" data-quiz-id="${qid}">Verificar Resposta</button>
          <div class="quiz-result" data-result-for="${qid}"></div>
        </div>`;
      break;
    }
    case 'embed': {
      const h=document.getElementById('elEmbed').value; if(!h){toast('Digite o HTML');return;}
      el=document.createElement('div'); el.innerHTML=h; break;
    }
  }
  if(el) v.appendChild(el);
  elClose();
}

function verificarQuiz(btn) {
  const qid=btn.getAttribute('data-quiz-id');
  const container=btn.closest('.quiz-card'); if(!container) return;
  const resultBox=container.querySelector(`.quiz-result[data-result-for="${qid}"]`);
  container.querySelectorAll('.option-label').forEach(l=>l.classList.remove('correct','incorrect'));
  const correctR=Array.from(container.querySelectorAll('input[type=radio]')).find(r=>r.hasAttribute('data-correct'));
  const selected=container.querySelector('input[type=radio]:checked');
  if(!selected){if(resultBox){resultBox.textContent='⚠️ Escolha uma opção';resultBox.style.color='#d97706';} return;}
  if(correctR) correctR.closest('.option-label')?.classList.add('correct');
  const selLabel=selected.closest('.option-label');
  if(selLabel&&!selected.hasAttribute('data-correct')) selLabel.classList.add('incorrect');
  if(resultBox){
    const ok=selected.hasAttribute('data-correct');
    resultBox.textContent=ok?'✅ Correto!':'❌ Incorreto';
    resultBox.style.color=ok?'#059669':'#dc2626';
  }
}
window.verificarQuiz = verificarQuiz;
